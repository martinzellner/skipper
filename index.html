<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skipper — trip planner</title>
<style>
  :root{
    --ink:#0A2F2C; --ink-soft:#4A6B67; --paper:#EDF1EF; --card:#fff;
    --line:#C9D6D2; --deep:#0A2F2C; --buoy:#C4172B; --sun:#E8A317; --done:#1C7C6B; --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
  header{background:var(--deep);color:#EDF1EF;padding:14px 16px 0;position:sticky;top:0;z-index:20;
    padding-top:calc(14px + env(safe-area-inset-top))}
  .brand{font-size:13px;font-weight:600;color:#7FB3A9;margin-bottom:8px}
  h1{font-size:26px;line-height:1.1;margin:0 0 10px;font-weight:700;letter-spacing:-.02em}
  .meter{display:flex;gap:2px;height:10px;margin-bottom:10px;background:rgba(255,255,255,.16);
    border-radius:2px;overflow:hidden}
  .meter span{flex:1}
  .meter span.on{background:var(--sun)}
  .meter.solid{display:block}
  .meter.solid i{display:block;height:100%;background:var(--sun)}
  .count{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:14px;color:#9EC5BD;padding-bottom:12px}
  .count button{background:none;border:1px solid rgba(255,255,255,.3);color:#9EC5BD;font:inherit;
    font-size:13px;padding:4px 10px;border-radius:99px;cursor:pointer;white-space:nowrap}
  nav{display:flex;overflow-x:auto;background:var(--deep);scrollbar-width:none;
    border-top:1px solid rgba(255,255,255,.12);position:sticky;top:0;z-index:19}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;background:none;border:none;border-bottom:3px solid transparent;color:#7FB3A9;
    font:inherit;font-size:14px;font-weight:600;padding:12px 14px;cursor:pointer;white-space:nowrap}
  nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--sun)}
  main{padding:16px 14px 60px;max-width:760px;margin:0 auto}
  .intro{font-size:15px;color:var(--ink-soft);margin:0 0 16px;max-width:62ch}
  .search{width:100%;padding:11px 14px;font:inherit;font-size:16px;border:1px solid var(--line);
    border-radius:var(--r);background:var(--card);color:var(--ink);margin-bottom:16px}
  .search:focus{outline:2px solid var(--done);outline-offset:1px;border-color:transparent}
  section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:12px;overflow:hidden}
  .sec-head{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:none;font:inherit;
    text-align:left;padding:13px 14px;cursor:pointer;color:var(--ink)}
  .sec-head:hover{background:#F5F8F7}
  .step{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--done);min-width:1.4em;flex:0 0 auto}
  .sec-title{font-weight:700;font-size:17px;flex:1;letter-spacing:-.01em}
  .sec-when{display:block;font-weight:500;font-size:14px;color:var(--ink-soft);margin-top:2px}
  .sec-count{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .sec-head.complete .sec-count{color:var(--done);font-weight:600}
  ul{list-style:none;margin:0;padding:0 0 6px;border-top:1px solid var(--line)}
  li{border-bottom:1px solid #EAF0EE;display:flex;align-items:flex-start;gap:8px}
  li:last-child{border-bottom:none}
  li.alert{background:#FCF0F1}
  li.off .txt{color:#9BB0AC}
  label.tick{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;cursor:pointer;min-height:44px;flex:1}
  label.tick:active{background:#F5F8F7}
  input[type=checkbox]{appearance:none;flex:0 0 auto;width:22px;height:22px;margin:1px 0 0;
    border:2px solid var(--line);border-radius:5px;background:#fff;cursor:pointer}
  input[type=checkbox]:checked{background:var(--done);border-color:var(--done)}
  input[type=checkbox]:checked::after{content:"";display:block;width:6px;height:11px;margin:2px auto 0;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
  input[type=checkbox]:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
  .txt{flex:1;font-size:16px;line-height:1.4}
  input:checked ~ .txt{color:#8FA5A1;text-decoration:line-through}
  .note{display:block;font-size:14.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4}
  .note.diet{color:var(--done);font-size:14px}
  .note.risk{color:var(--buoy);font-weight:500}
  input:checked ~ .txt .note{color:#A9BAB7}
  .tips{background:#F3F7F5;font-size:15px;color:var(--ink-soft);padding:2px 14px 10px;border-top:1px solid var(--line)}
  .tips p{margin:8px 0;line-height:1.4}
  .warn{background:#FDF1E7;border-left:4px solid var(--sun);padding:12px 14px;font-size:15px}
  .warn strong{display:block;margin-bottom:2px}
  .qty{display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding:10px 14px 10px 0;flex:0 0 auto}
  .rec{font-size:14px;font-weight:600;color:var(--done);white-space:nowrap;font-variant-numeric:tabular-nums}
  .rec.free{font-weight:500;color:var(--ink-soft)}
  .rec.none{color:#A9BAB7;text-decoration:line-through}
  .own{width:78px;padding:5px 7px;font:inherit;font-size:14px;text-align:right;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:var(--ink)}
  .own:focus{outline:2px solid var(--done);outline-offset:1px;border-color:transparent}
  .own::placeholder{color:#A9BAB7}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;padding:14px}
  .panel h2{font-size:15px;margin:0 0 12px;color:var(--ink-soft);font-weight:600}
  .grid{display:grid;gap:12px}
  @media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
  .field{display:block;font-size:14px;color:var(--ink-soft)}
  .field input,.field select{width:100%;margin-top:4px;padding:10px 12px;font:inherit;font-size:16px;
    border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{outline:2px solid var(--done);outline-offset:1px;border-color:transparent}
  .summary{display:flex;flex-wrap:wrap;gap:18px;padding:14px;border-top:1px solid var(--line);
    background:#F3F7F5;font-size:15px}
  .summary div b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .summary div span{color:var(--ink-soft);font-size:13px}
  .member{border-bottom:1px solid #EAF0EE;padding:14px}
  .member:last-of-type{border-bottom:none}
  .m-top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .m-top input{flex:1;min-width:0;padding:9px 11px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px}
  .m-top input.time{flex:0 0 auto;width:186px}
  .rowlab{font-size:12.5px;color:var(--ink-soft);margin:8px 0 5px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font:inherit;font-size:13.5px;
    padding:5px 11px;border-radius:99px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
  .chip.thirst[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#2A1D00}
  .allergy{width:100%;margin-top:10px;padding:9px 11px;font:inherit;font-size:15px;
    border:1px solid var(--line);border-radius:8px}
  .del{background:none;border:none;color:#A9BAB7;font-size:22px;cursor:pointer;padding:6px 10px;line-height:1}
  .del:hover{color:var(--buoy)}
  .btn{padding:10px 16px;border:none;background:var(--done);color:#fff;font:inherit;font-weight:600;
    border-radius:8px;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .add{display:flex;gap:8px;padding:12px 14px}
  .add input{flex:1;padding:9px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper span{font-size:15px;color:var(--ink-soft);min-width:74px}
  .stepper button{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;
    font:inherit;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper b{font-size:18px;min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums}
  .plan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
    margin-bottom:12px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .plan p{flex:1 1 100%;margin:0;font-size:14px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:12px}
  .banner{background:#FCF0F1;border:1px solid #F0C9CD;border-radius:var(--r);padding:12px 14px;
    margin-bottom:12px;font-size:15px}
  .banner strong{display:block;margin-bottom:2px}
  .call{display:flex;gap:10px;flex-wrap:wrap;padding:14px}
  .call a{flex:1 1 150px;text-decoration:none;background:var(--buoy);color:#fff;padding:12px 14px;
    border-radius:var(--r);font-weight:600;font-size:16px}
  .call a span{display:block;font-weight:400;font-size:13px;opacity:.85}
  .call a.mail{background:var(--ink)}
  .fields{padding:4px 14px 14px;display:grid;gap:10px}
  .hit{font-size:13px;color:var(--ink-soft);padding:10px 14px 6px;font-weight:600}
  .empty{color:var(--ink-soft);font-size:15px;padding:20px 14px}
  .day-top{font-weight:700;font-size:15px;margin-bottom:10px;letter-spacing:-.01em}
  .suggest-row{flex-direction:column;align-items:stretch;padding:12px 14px}
  .suggest-row .txt{margin-bottom:6px}
  .suggest-row a{color:var(--ink);text-decoration:underline}
  .assign{width:100%;margin-top:2px;padding:9px 11px;font:inherit;font-size:15px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  footer{max-width:760px;margin:0 auto;padding:0 14px 40px;font-size:13px;color:var(--ink-soft)}
  @media (min-width:700px){h1{font-size:32px}}
</style>
</head>
<body>

<header>
  <div class="brand">Trip planner</div>
  <h1 id="title"></h1>
  <div class="meter" id="meter"></div>
  <div class="count"><span id="count"></span><button id="reset" type="button">Clear ticks</button></div>
</header>
<nav id="tabs" role="tablist"></nav>

<main>
  <p class="intro" id="intro"></p>
  <input class="search" id="search" type="search" placeholder="Search everything" autocomplete="off">
  <div id="body"></div>
</main>

function waitForFb(timeoutMs=3000){
  return new Promise(resolve=>{
    if(window.__fb) return resolve(true);
    const t0=Date.now();
    const iv=setInterval(()=>{
      if(window.__fb){ clearInterval(iv); resolve(true); }
      else if(Date.now()-t0>timeoutMs){ clearInterval(iv); resolve(false); }
    },50);
  });
}

const norm=i=>typeof i==="string"?{x:i}:i;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idOf=(l,s,i)=>DATA[l].id+"."+s+"."+i;
const $=id=>document.getElementById(id);
const nf=n=>n.toLocaleString("en-GB",{maximumFractionDigits:1});
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-");

function crewCount(){ return S.crew.length || S.crewManual; }
function tripDays(){
  const {start,end}=S.trip;
  if(start&&end){ const d=Math.round((new Date(end)-new Date(start))/86400000)+1; if(d>0&&d<60) return d; }
  return S.daysManual;
}
function dietCount(k){ return S.crew.filter(m=>(m.diet||[]).includes(k)).length; }
function allergyList(){
  return S.crew.filter(m=>(m.allergies||"").trim()).map(m=>({name:m.name||"Crew member",text:m.allergies.trim()}));
}

/* weighted group sizes — unset profiles count as an average mixed crew member */
function groups(){
  const n=crewCount();
  const g={crew:n,beer:0,wine:0,spirits:0,soft:0,coffee:0,tea:0,
           bfEggs:0,bfMuesli:0,bfBread:0,bfLight:0,plant:0,meat:0};
  const members = S.crew.length ? S.crew : Array.from({length:n},()=>({}));
  const DEF={beer:.6,wine:.5,spirits:.4,soft:.7,coffee:.7,tea:.3};
  const LVL={light:.6,avg:1,big:1.5};
  members.forEach(m=>{
    const diet=m.diet||[], lvl=LVL[m.level||"avg"], noalc=diet.includes("noalc");
    if(m.bf==="eggs") g.bfEggs++;
    else if(m.bf==="muesli") g.bfMuesli++;
    else if(m.bf==="bread") g.bfBread++;
    else if(m.bf==="light") g.bfLight++;
    else if(m.bf!=="none"){ g.bfEggs+=.3; g.bfMuesli+=.3; g.bfBread+=.4; }
    const chosen=(m.drinks&&m.drinks.length)?m.drinks:null;
    Object.keys(DEF).forEach(k=>{
      let v = chosen ? (chosen.includes(k)?1:0) : DEF[k];
      if(noalc&&(k==="beer"||k==="wine"||k==="spirits")) v=0;
      if(k!=="coffee"&&k!=="tea") v*=lvl;
      g[k]+=v;
    });
    if(diet.includes("vegan")||diet.includes("lf")) g.plant++;
    if(!(diet.includes("veg")||diet.includes("vegan"))) g.meat++;
  });
  return g;
}
function rnd(v,u){
  if(u==="g") return Math.max(50,Math.round(v/50)*50);
  if(v>=20) return Math.round(v/2)*2;
  if(v>=4)  return Math.round(v);
  return Math.round(v*2)/2;
}
function qtyFor(it){
  const g=groups(), n=crewCount(), d=tripDays();
  const vegans=dietCount("vegan"), gf=dietCount("gf");
  const notes=[];
  if(it.cat==="gluten"&&gf) notes.push(`${gf} gluten-free — add an alternative`);
  const catF = it.cat==="meat" ? g.meat/n : it.cat==="dairy" ? (n-vegans)/n : 1;
  if(it.need && (g[it.need]||0)<0.5)
    return {t:"not needed", free:true, none:true, notes:[`nobody on ${GLABEL[it.need]||it.need}`]};

  if(it.r){
    let lo=0,hi=0;
    it.r.forEach(t=>{ const c=g[t.g]||0; lo+=c*d*t.d; hi+=c*d*(t.d2||t.d); });
    lo*=catF; hi*=catF;
    const why=it.r.filter(t=>t.g!=="crew"&&(g[t.g]||0)>=0.5)
                  .map(t=>`${Math.round(g[t.g])} ${GLABEL[t.g]||t.g}`);
    if(why.length) notes.unshift(why.join(", "));
    if(lo<0.4) return {t:"not needed", free:true, none:true, notes};
    const a=rnd(lo,it.u), b=hi>lo*1.15?rnd(hi,it.u):null;
    return {t:nf(a)+(b&&b>a?"–"+nf(b):"")+" "+it.u, notes};
  }
  if(it.q==null) return {t:catF===0?"not needed":(it.free||""), free:true, none:catF===0, notes};
  if(catF===0) return {t:"not needed", free:true, none:true, notes:[it.cat==="meat"?"nobody eats meat":"all vegan"].concat(notes)};
  if(it.cat==="meat"&&catF<1) notes.unshift(`${Math.round(n-g.meat)} of ${n} don't eat meat`);
  if(it.cat==="dairy"&&vegans) notes.unshift(`${vegans} vegan`);
  const mult=(it.fix?1:(n/9)*(d/8))*catF;
  const a=rnd(Math.max(it.q*mult,0.5),it.u), b=it.q2?rnd(it.q2*mult,it.u):null;
  return {t:nf(a)+(b&&b>a?"–"+nf(b):"")+" "+it.u, notes};
}
function allergyHit(name){
  const words=[];
  allergyList().forEach(a=>a.text.split(/[,;/]|\band\b/).forEach(w=>{
    w=w.trim().toLowerCase(); if(w.length>=3) words.push({w,who:a.name});
  }));
  const n=name.toLowerCase();
  const hit=words.filter(o=>n.includes(o.w)||o.w.includes(n));
  return hit.length?hit:null;
}
function listIds(l){
  const out=[];
  (DATA[l].sections||[]).forEach((sec,si)=>sec.items.forEach((_,ii)=>out.push(idOf(l,si,ii))));
  if(DATA[l].type==="shop"){
    S.custom.forEach(c=>out.push("custom."+c.id));
    mealExtras().items.forEach(it=>out.push("mealx."+slug(it.n)));
  }
  return out;
}

/* ---- meal plan ---- */
function crewNeeds(){
  const need=[];
  if(dietCount("veg")+dietCount("vegan")>0) need.push("veg");
  if(dietCount("vegan")>0) need.push("vegan");
  if(dietCount("nopork")>0) need.push("nopork");
  if(dietCount("gf")>0) need.push("gf");
  if(dietCount("lf")>0) need.push("lf");
  return need;
}
function allRecipes(){ return S.customRecipes||[]; }
function recipeViolations(r){ return crewNeeds().filter(k=>r.diets.indexOf(k)===-1); }
function recipeAllergyHits(r){
  const words=[];
  allergyList().forEach(a=>a.text.split(/[,;/]|\band\b/).forEach(w=>{
    w=w.trim().toLowerCase(); if(w.length>=3) words.push({w,who:a.name});
  }));
  const text=r.ingr.map(i=>i.n).join(" ").toLowerCase();
  const hit=words.filter(o=>text.includes(o.w));
  return [...new Set(hit.map(h=>h.who))];
}
function dayLabel(i){
  const {start}=S.trip;
  if(start){ const dt=new Date(start); dt.setDate(dt.getDate()+i);
    return dt.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"}); }
  return "Day "+(i+1);
}
const UNIT_MAP={g:"g",gram:"g",grams:"g",kg:"kg",kilogram:"kg",kilograms:"kg",kilo:"kg",kilos:"kg",
  ml:"ml",l:"L",litre:"L",litres:"L",liter:"L",liters:"L",tsp:"tsp",teaspoon:"tsp",teaspoons:"tsp",
  tbsp:"tbsp",tablespoon:"tbsp",tablespoons:"tbsp",cup:"cup",cups:"cup",oz:"oz",ounce:"oz",ounces:"oz",
  lb:"lb",lbs:"lb",pound:"lb",pounds:"lb",piece:"piece",pieces:"piece",clove:"clove",cloves:"clove",
  bunch:"bunch",bunches:"bunch",tin:"tin",tins:"tin",can:"tin",cans:"tin",tub:"tub",tubs:"tub",
  tube:"tube",tubes:"tube",pinch:"pinch",pinches:"pinch",slice:"slice",slices:"slice",head:"head",
  heads:"head",pack:"pack",packs:"pack",packet:"pack",packets:"pack",bottle:"bottle",bottles:"bottle",
  bulb:"bulb",bulbs:"bulb"};
function parseIngredientLine(line){
  line=(line||"").trim(); if(!line) return null;
  const FRAC={"½":" 1/2","⅓":" 1/3","⅔":" 2/3","¼":" 1/4","¾":" 3/4","⅛":" 1/8"};
  Object.keys(FRAC).forEach(k=>{ line=line.split(k).join(FRAC[k]); });
  const m=line.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s+(.*)$/);
  let qty=1, rest=line;
  if(m){
    const qs=m[1].trim();
    if(qs.indexOf("/")!==-1){
      const parts=qs.split(/\s+/);
      if(parts.length===2){ const ab=parts[1].split("/"); qty=parseFloat(parts[0])+parseFloat(ab[0])/parseFloat(ab[1]); }
      else { const ab=qs.split("/"); qty=parseFloat(ab[0])/parseFloat(ab[1]); }
    } else qty=parseFloat(qs);
    rest=m[2].trim();
  }
  const words=rest.split(/\s+/);
  let unit="piece", name=rest;
  if(words.length && UNIT_MAP[words[0].toLowerCase()]){
    unit=UNIT_MAP[words[0].toLowerCase()]; name=words.slice(1).join(" ");
  }
  name=name.replace(/^of\s+/i,"").trim();
  if(!name) name=rest||line;
  return {n:name, q:qty||1, u:unit};
}
function rndExtra(v,u){
  if(["tin","tub","tube","piece","pack","head","clove","bunch"].includes(u)) return Math.max(1,Math.round(v));
  if(u==="kg") return Math.round(Math.max(v,0.05)*10)/10;
  if(u==="pinch") return Math.max(1,Math.round(v));
  return Math.round(v*10)/10;
}
function mealExtras(){
  const map={}; let count=0; const n=crewCount(); const live=[];
  Object.keys(S.meals||{}).forEach(day=>{
    if(+day>=tripDays()) return;
    const slots=S.meals[day];
    ["lunch","dinner"].forEach(meal=>{
      const s=slots&&slots[meal];
      if(s&&s.type==="recipe"&&s.recipe){
        const r=allRecipes().find(x=>x.id===s.recipe); if(!r) return;
        count++;
        r.ingr.forEach(ing=>{
          const key=ing.n+"|"+ing.u;
          map[key]=map[key]||{n:ing.n,u:ing.u,q:0,c:0};
          map[key].q+=ing.q*n; map[key].c++;
        });
      } else if(s&&s.type==="live"&&s.live){
        count++;
        live.push({name:s.live.name,url:s.live.url,day:+day,meal});
      }
    });
  });
  return {items:Object.values(map), count, live};
}

async function suggestRecipes(){
  liveLoading=true; liveError=""; render();
  const need=[];
  if(crewNeeds().includes("vegan")) need.push("vegan");
  else if(crewNeeds().includes("veg")) need.push("vegetarian");
  if(crewNeeds().includes("gf")) need.push("gluten-free");
  if(crewNeeds().includes("lf")) need.push("dairy-free");
  if(crewNeeds().includes("nopork")) need.push("no pork");
  const allergies=allergyList().map(a=>a.text).join("; ");
  const prompt=`Suggest 5 real recipes simple enough to cook aboard a small sailing boat (one stovetop, small fridge, limited pans). Crew of ${crewCount()} for ${tripDays()} days.
Dietary constraints that must ALL be met: ${need.length?need.join(", "):"none specific"}.
Allergies or foods to avoid across the crew: ${allergies||"none stated"}.
Use web search to find real recipes that fit. For each, use the recipe's real title and a working source URL you found.
Respond with ONLY a JSON array and nothing else — no markdown fences, no commentary. Each item: {"name": string, "type": "lunch" or "dinner", "blurb": a single short original sentence (under 15 words) describing the dish in your own words, "url": string}.`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:1000,
        messages:[{role:"user",content:prompt}],
        tools:[{type:"web_search_20250305",name:"web_search"}]
      })
    });
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const s=text.indexOf("["), e=text.lastIndexOf("]");
    const arr = s!==-1&&e!==-1 ? JSON.parse(text.slice(s,e+1)) : null;
    liveSuggestions = Array.isArray(arr) ? arr.filter(x=>x&&x.name&&x.url&&x.type) : [];
    if(!liveSuggestions.length) liveError="No matching recipes came back — try again.";
  }catch(err){
    liveError="Couldn't reach the suggestion service just now — try again in a moment.";
  }
  liveLoading=false; render();
}

    if(d.vegetarian) diets.push("veg");
    if(d.vegan){ diets.push("vegan"); if(diets.indexOf("veg")===-1) diets.push("veg"); }
    if(d.glutenFree) diets.push("gf");
    if(d.dairyFree) diets.push("lf");
    const porkWords=["pork","bacon","ham","prosciutto","sausage","chorizo","pancetta","lard","salami","speck"];
    const names=(d.extendedIngredients||[]).map(i=>((i.nameClean||i.name||"")+"").toLowerCase());
    if(!names.some(n=>porkWords.some(w=>n.includes(w)))) diets.push("nopork");
    const dt=d.dishTypes||[];
    let type="both";
    if(dt.some(x=>x==="dinner"||x==="main course"||x==="main dish")) type="dinner";
    else if(dt.indexOf("lunch")!==-1) type="lunch";
    draftRecipe={
      id:"", name:d.title||"", type, url:d.sourceUrl||d.spoonacularSourceUrl||"",
      blurb:"", serves:d.servings||4, diets,
      ingr:(d.extendedIngredients||[]).map(i=>({n:i.nameClean||i.name||"ingredient", q:i.amount||1, u:i.unit||"piece"}))
    };
    if(!draftRecipe.ingr.length) draftRecipe.ingr=[{n:"",q:"",u:"piece"}];
    spoonResults=[]; spoonError="";
  }catch(err){
    spoonError="Couldn't load that recipe's details — try again.";
  }
  spoonLoading=false; renderMeals();
}

const SHARE_FIELDS=["trip","crew","meals","customRecipes","own","custom","crewManual","daysManual","c"];
function pickShare(){ const p={}; SHARE_FIELDS.forEach(k=>{ if(S[k]!==undefined) p[k]=S[k]; }); return p; }
function applyShare(payload){
  SHARE_FIELDS.forEach(k=>{ if(payload[k]!==undefined) S[k]=payload[k]; });
  save();
}

function fbConfigured(){ return !!(window.__fb && window.__fb.configured); }
function genCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s=""; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function subscribeFb(code){
  window.__fb.subscribe(code, data=>{
    if(data){
      const incoming=JSON.stringify(shareSubset(data));
      if(incoming===lastPushedJSON) return; // our own write echoing back — ignore, don't disturb typing
      syncingRemote=true; applyShare(data); syncingRemote=false;
      fbStatus="Updated from another device.";
      if(isTyping()) pendingRender=true; else render();
    } else {
      fbStatus="Synced just now"; if(!isTyping()) renderTrip();
    }
  }, err=>{ fbStatus="Sync error — check your connection."; if(!isTyping()) renderTrip(); });
}
async function fbStart(){
  const have=await waitForFb();
  if(!have || !fbConfigured()){ fbStatus="Firebase isn't configured yet."; renderTrip(); return; }
  const code=genCode();
  fbStatus="Connecting…"; S.tripCode=code; renderTrip();
  try{ await fbPush(); fbStatus="Synced just now"; subscribeFb(code); renderTrip(); }
  catch(e){ fbStatus="Couldn't start live sync — check your Firebase setup."; renderTrip(); }
}
function fbStop(){
  if(window.__fb) window.__fb.unsubscribe();
  S.tripCode=""; fbStatus=""; lastPushedJSON=null; save(); render();
}
async function fbCopyLink(){
  const base=(location.protocol.indexOf("http")===0) ? location.origin+location.pathname : "";
  const link = base ? base+"#t="+S.tripCode : S.tripCode;
  try{ await navigator.clipboard.writeText(link); fbStatus="Invite link copied."; }
  catch(e){ fbStatus="Copy failed — the code is "+S.tripCode; }
  renderTrip();
}

/* Rebuilding innerHTML destroys the focused field, so remember where the cursor
   was and put it back afterwards. Without this, typing anywhere jumps around. */
function focusKey(el){
  if(!el || !bodyEl.contains(el)) return null;
  const tag=el.tagName.toLowerCase();
  if(!/^(input|select|textarea)$/.test(tag)) return null;
  if(el.id) return "#"+el.id;
  let sel=tag;
  for(let i=0;i<el.attributes.length;i++){
    const a=el.attributes[i];
    if(a.name.indexOf("data-")===0) sel+='['+a.name+'="'+a.value.replace(/"/g,'\\"')+'"]';
  }
  return sel===tag?null:sel;
}
function withFocus(fn){
  const el=document.activeElement, key=focusKey(el);
  let start=null,end=null;
  if(key){ try{ start=el.selectionStart; end=el.selectionEnd; }catch(e){} }
  fn();
  if(!key) return;
  let next=null; try{ next=bodyEl.querySelector(key); }catch(e){}
  if(!next) return;
  try{ next.focus({preventScroll:true}); }catch(e){ next.focus(); }
  if(start!=null && next.setSelectionRange){
    try{ next.setSelectionRange(start,end); }catch(e){}
  }
}
function isTyping(){
  const el=document.activeElement;
  return !!(el && bodyEl.contains(el) && /^(input|textarea|select)$/i.test(el.tagName));
}
let pendingRender=false;

    renderTabs(); renderHead();
    if(query.trim()&&!isForm(active)){ introEl.style.display="none"; renderSearch(); }
    else{ introEl.style.display=""; renderList(); }
  });
}

  }
  if(btn.dataset.drink&&m){
    m.drinks=m.drinks||[]; const k=btn.dataset.drink, on=m.drinks.includes(k);
    m.drinks = on ? m.drinks.filter(x=>x!==k) : m.drinks.concat(k);
    btn.setAttribute("aria-pressed",String(!on)); save(); return;
  }
  if(btn.dataset.bf&&m){
    m.bf = m.bf===btn.dataset.bf ? "" : btn.dataset.bf;
    btn.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.bf===m.bf)));
    save(); return;
  }
  if(btn.dataset.level&&m){
    m.level=btn.dataset.level;
    btn.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.level===m.level)));
    save(); return;
  }
  if(btn.dataset.rm){ S.crew=S.crew.filter(x=>x.id!==btn.dataset.rm); save(); render(); return; }
  if(btn.id==="addCrew"){
    S.crew.push({id:Date.now().toString(36),name:"",arrival:"",diet:[],drinks:[],bf:"",level:"avg",allergies:""});
    save(); render();
    const inputs=bodyEl.querySelectorAll("input[data-f='name']");
    if(inputs.length) inputs[inputs.length-1].focus();
    return;
  }
  if(btn.dataset.n&&!btn.disabled){
    const k=btn.dataset.n;
    S[k]=Math.min(k==="crewManual"?16:30,Math.max(1,S[k]+ +btn.dataset.d)); save(); render(); return;
  }
  if(btn.dataset.del){ S.custom=S.custom.filter(c=>c.id!==btn.dataset.del); delete S.done["custom."+btn.dataset.del]; save(); render(); return; }
  if(btn.id==="addItem"){ addItem(); return; }
  const head=btn.closest(".sec-head[data-sec]");
  if(head&&head.dataset.sec!=="x"&&!query.trim()){
    collapsed[active+"."+head.dataset.sec]=!collapsed[active+"."+head.dataset.sec]; render();
  }
});
bodyEl.addEventListener("keydown",e=>{
  if(e.target.id==="newItem"&&e.key==="Enter") addItem();
  if(e.target.id==="spoonQuery"&&e.key==="Enter") spoonSearch();
});
function addItem(){
  const inp=$("newItem"); if(!inp||!inp.value.trim()) return;
  S.custom.push({id:Date.now().toString(36),x:inp.value.trim()}); save(); render();
  const n=$("newItem"); if(n) n.focus();
}
resetEl.addEventListener("click",()=>{
  const l=DATA[active];
  if(!confirm(`Clear every tick in “${l.title}”?`)) return;
  listIds(active).forEach(i=>delete S.done[i]); save(); render();
});
searchEl.addEventListener("input",e=>{ query=e.target.value; render(); });

(async()=>{
  await load();
  const h=location.hash||"";
  if(h.indexOf("#t=")===0){
    const code=h.slice(3).trim().toUpperCase();
    const have=await waitForFb();
    if(have && fbConfigured() && code){
      const ok=confirm("Join live sync for trip "+code+"? This links this device to that shared trip and replaces what's here now.");
      if(ok){ S.tripCode=code; fbStatus="Connecting…"; subscribeFb(code); }
    } else {
      fbStatus="That invite link needs live sync set up first.";
    }
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  } else if(S.tripCode){
    const have=await waitForFb();
    if(have && fbConfigured()){ fbStatus="Connecting…"; subscribeFb(S.tripCode); }
  }
  searchEl.style.display=isForm(active)?"none":"";
  render();
})();
</script>
</body>
</html>
