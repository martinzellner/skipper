<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skipper — trip planner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#072A26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skipper">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --ink:#072A26;          /* deep sea — text */
    --ink-2:#4A6B67;        /* muted */
    --paper:#EEF2F0;        /* chart paper */
    --card:#FFFFFF;
    --line:#D3DEDA;
    --deep:#072A26;         /* header + nav */
    --deep-2:#0E4139;
    --brass:#DFA327;        /* instrument brass — progress, active */
    --done:#12776A;         /* confirmed */
    --alert:#BE1B2C;        /* danger only */
    --r:12px;
    --nav-h:60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2.5px solid var(--brass);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ---------- header ---------- */
  header{background:var(--deep);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 0;
    position:sticky;top:0;z-index:20}
  .head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  h1{font-size:27px;line-height:1.05;margin:0;font-weight:680;letter-spacing:-.025em}
  .head-sub{font-size:13.5px;color:#8FBDB4;margin-top:5px;font-variant-numeric:tabular-nums}
  .offline-dot{display:none;align-items:center;gap:5px;font-size:12px;color:#F0C27A;margin-top:6px}
  body.is-offline .offline-dot{display:inline-flex}
  .offline-dot i{width:7px;height:7px;border-radius:50%;background:#F0C27A;display:block}
  .ghost{background:none;border:1px solid rgba(255,255,255,.28);color:#B8D8D1;
    font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .ghost:hover{border-color:#fff;color:#fff}
  .meter{height:4px;margin:12px -16px 0;background:rgba(255,255,255,.14);display:flex}
  .meter i{display:block;height:100%;background:var(--brass);transition:width .25s ease}

  /* ---------- segmented sub-nav (checklists) ---------- */
  .subnav{display:flex;gap:6px;overflow-x:auto;background:var(--deep);padding:12px 16px;
    scrollbar-width:none;position:sticky;top:0;z-index:19}
  .subnav::-webkit-scrollbar{display:none}
  .subnav[hidden]{display:none}
  .subnav button{flex:0 0 auto;background:rgba(255,255,255,.08);border:none;color:#A8CFC7;
    font-size:14px;font-weight:600;padding:9px 15px;border-radius:99px;cursor:pointer}
  .subnav button[aria-selected="true"]{background:#fff;color:var(--deep)}

  /* ---------- bottom navigation ---------- */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:var(--deep);border-top:1px solid rgba(255,255,255,.1);
    padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom button{flex:1;background:none;border:none;cursor:pointer;color:#7FB0A7;
    height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:11.5px;font-weight:600;letter-spacing:.01em;position:relative;padding:0}
  nav.bottom button svg{width:23px;height:23px;stroke:currentColor;fill:none;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  nav.bottom button[aria-selected="true"]{color:#fff}
  nav.bottom button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;
    height:3px;background:var(--brass);border-radius:0 0 3px 3px}
  nav.bottom button.sos[aria-selected="true"]{color:#FF9AA4}
  nav.bottom button.sos[aria-selected="true"]::before{background:var(--alert)}

  main{padding:18px 14px calc(var(--nav-h) + 40px);max-width:760px;margin:0 auto}
  .intro{font-size:15.5px;color:var(--ink-2);margin:0 0 18px;max-width:60ch;line-height:1.5}
  .search{width:100%;padding:12px 15px;font-size:16px;border:1px solid var(--line);
    border-radius:var(--r);background:var(--card);margin-bottom:16px}
  .search:focus{outline:2px solid var(--done);outline-offset:1px;border-color:transparent}

  /* ---------- cards & sections ---------- */
  section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:14px;overflow:hidden}
  .sec-head{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
    text-align:left;padding:15px 16px;cursor:pointer;min-height:56px}
  .sec-head:hover{background:#F6F9F8}
  .step{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:#fff;flex:0 0 auto;
    background:var(--done);width:23px;height:23px;border-radius:50%;display:flex;
    align-items:center;justify-content:center}
  .sec-title{font-weight:680;font-size:17.5px;flex:1;letter-spacing:-.015em;line-height:1.25}
  .ico{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;
    stroke-linejoin:round;flex:0 0 auto}
  .ico.dim{color:#8AA39E}
  .sec-head .ico{color:var(--done)}
  .fact{display:flex;gap:13px;align-items:flex-start;padding:13px 16px;border-bottom:1px solid #EDF2F0}
  .fact:last-child{border-bottom:none}
  .fact .ico{margin-top:1px;color:#8AA39E}
  .fact b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-2);font-weight:650;margin-bottom:3px}
  .fact span{font-size:15.5px;line-height:1.45}
  .fact > div{min-width:0;flex:1}
  .grp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:#8AA39E;
    padding:16px 16px 7px;background:#F8FAF9;border-bottom:1px solid #EDF2F0}
  .grp:first-child{padding-top:14px}
  .echips{display:flex;flex-wrap:wrap;gap:7px;margin-top:3px}
  .echip{display:inline-flex;align-items:baseline;gap:6px;background:var(--alert);color:#fff;
    text-decoration:none;font-weight:660;font-size:15px;padding:7px 13px;border-radius:99px;
    font-variant-numeric:tabular-nums}
  .echip i{font-style:normal;font-weight:450;font-size:12.5px;opacity:.88}
  .echip.plain{background:#EFF4F2;color:var(--ink-2);font-weight:550}
  .bins{display:flex;flex-direction:column;gap:7px;margin-top:5px}
  .bin{display:flex;align-items:baseline;gap:9px;font-size:14.5px;line-height:1.4}
  .bin b{font-weight:640;flex:0 0 auto;color:var(--ink)}
  .bin > span{color:var(--ink-2);min-width:0}
  .swatch{width:13px;height:13px;border-radius:4px;flex:0 0 auto;align-self:center;
    border:1px solid rgba(7,42,38,.18);box-shadow:inset 0 -2px 3px rgba(0,0,0,.08)}
  .bin-note{display:block;font-size:14px;color:var(--ink-2);line-height:1.45;padding-left:22px}
  .wx{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .wx-line{font-size:15px;line-height:1.5}
  .tag{display:inline-block;background:#E7F1EE;color:var(--done);font-weight:660;font-size:13.5px;
    padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tag.time{background:var(--deep);color:#fff}
  .tag.ch{background:#FBF0D8;color:#8A6316}
  .mcard{border-bottom:1px solid #EDF2F0}
  .mcard:last-of-type{border-bottom:none}
  .mhead{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;
    padding:14px 16px;cursor:pointer;text-align:left;min-height:58px}
  .mhead:hover{background:#F6F9F8}
  .mname{font-weight:640;font-size:16.5px;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mmeta{flex:1;min-width:0;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;text-align:right}
  .mbody{padding:0 16px 16px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#EFF4F2;
    color:var(--ink-2);padding:3px 8px;border-radius:99px;margin-left:5px}
  .badge.warn-b{background:#FDF2F3;color:var(--alert)}
  .sec-when{display:block;font-weight:450;font-size:14px;color:var(--ink-2);margin-top:3px}
  .sec-count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:0 0 auto;
    background:#EFF4F2;padding:3px 9px;border-radius:99px}
  .sec-head.complete .sec-count{color:#fff;background:var(--done)}
  .chev{flex:0 0 auto;width:9px;height:9px;border-right:2px solid #A9BCB8;border-bottom:2px solid #A9BCB8;
    transform:rotate(45deg);margin-left:2px;transition:transform .2s}
  .sec-head.closed .chev{transform:rotate(-45deg)}

  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{border-bottom:1px solid #EDF2F0;display:flex;align-items:center;gap:6px;min-height:54px}
  li:last-child{border-bottom:none}
  li.alert{background:#FDF2F3;box-shadow:inset 3px 0 0 var(--alert)}
  li.off{opacity:.5}
  label.tick{display:flex;gap:14px;align-items:center;padding:12px 16px;cursor:pointer;flex:1;min-width:0}
  label.tick:active{background:#F6F9F8}
  input[type=checkbox]{appearance:none;flex:0 0 auto;width:24px;height:24px;margin:0;
    border:2px solid #BDCCC8;border-radius:7px;background:#fff;cursor:pointer;transition:.12s}
  input[type=checkbox]:checked{background:var(--done);border-color:var(--done)}
  input[type=checkbox]:checked::after{content:"";display:block;width:6px;height:11px;margin:2px auto 0;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
  .txt{flex:1;font-size:16.5px;line-height:1.35;min-width:0}
  input:checked ~ .txt{color:#93A8A4;text-decoration:line-through;text-decoration-color:#C3D2CF}
  .note{display:block;font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.4}
  .note.diet{color:var(--done)}
  .note.risk{color:var(--alert);font-weight:550}
  input:checked ~ .txt .note{color:#AEC0BC}

  .tips{background:#F5F8F7;font-size:14.5px;color:var(--ink-2);padding:4px 16px 12px;
    border-top:1px solid var(--line);line-height:1.5}
  .tips p{margin:9px 0}
  .warn{background:#FDF4E8;box-shadow:inset 4px 0 0 var(--brass);padding:13px 16px;font-size:15px}
  .warn strong{display:block;margin-bottom:3px}

  /* quantity pill */
  .qty{display:flex;align-items:center;gap:7px;padding:0 14px 0 0;flex:0 0 auto}
  .rec{font-size:14px;font-weight:640;color:var(--done);white-space:nowrap;font-variant-numeric:tabular-nums;
    background:#E7F1EE;padding:5px 11px;border-radius:99px}
  .rec.free{font-weight:500;color:var(--ink-2);background:#EFF3F1}
  .rec.none{color:#9FB2AE;background:#F2F5F4;text-decoration:line-through}
  button.rec{border:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font:inherit;
    font-size:14px;font-weight:640;background:#E7F1EE;color:var(--done)}
  button.rec .split-ico{width:14px;height:14px;stroke-width:2.1;opacity:.75}
  button.rec[aria-expanded="true"]{background:var(--done);color:#fff}
  .split{display:block;margin-top:8px;padding:9px 11px;background:#F5F8F7;border-radius:9px;
    border-left:3px solid var(--done)}
  .split-row{display:block;font-size:14px;color:var(--ink-2);line-height:1.5}
  .split-row b{color:var(--ink);font-variant-numeric:tabular-nums}
  .sug{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 14px 10px;width:100%;
    font-size:13.5px;color:var(--ink-2)}
  .sug .chip{font-size:13px;padding:6px 11px}
  .own{width:66px;padding:7px 9px;font-size:14px;text-align:right;border:1px solid var(--line);
    border-radius:8px;background:#fff}
  .own:focus{outline:2px solid var(--done);outline-offset:1px;border-color:transparent}
  .own::placeholder{color:#B4C4C0}

  /* ---------- panels & forms ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:14px;padding:16px}
  .panel h2{font-size:17px;margin:0 0 14px;font-weight:680;letter-spacing:-.015em;
    display:flex;align-items:center;gap:9px}
  .panel h2 .ico{color:var(--done)}
  .boat-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:15px 16px 17px;
    border-top:1px solid var(--line);background:#FAFCFB}
  @media(max-width:400px){.boat-grid{grid-template-columns:1fr}}
  .grid{display:grid;gap:13px}
  @media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
  .field{display:block;font-size:13.5px;color:var(--ink-2);font-weight:550}
  .field input,.field select{width:100%;margin-top:6px;padding:12px 13px;font-size:16px;
    border:1px solid var(--line);border-radius:9px;background:#fff}
  .field input:focus,.field select:focus{outline:2px solid var(--done);outline-offset:1px;border-color:transparent}

  .summary{display:flex;flex-wrap:wrap;gap:22px;padding:16px;border-top:1px solid var(--line);
    background:#F5F8F7}
  .summary div b{display:block;font-size:23px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    font-weight:680;line-height:1.15}
  .summary div span{color:var(--ink-2);font-size:12.5px}

  .member{border-bottom:1px solid #EDF2F0;padding:16px}
  .member:last-of-type{border-bottom:none}
  .m-top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
  .m-top input{flex:1;min-width:0;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:9px}
  .m-top input.time{flex:0 0 auto;width:180px}
  .rowlab{font-size:12px;color:var(--ink-2);margin:12px 0 6px;font-weight:650}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:13.5px;
    padding:7px 12px;border-radius:99px;cursor:pointer;transition:.12s}
  .chip[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
  .chip.thirst[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#2B1D00}
  .allergy{width:100%;margin-top:12px;padding:11px 12px;font-size:15px;
    border:1px solid var(--line);border-radius:9px}

  .del{background:none;border:none;color:#B9C7C3;font-size:24px;cursor:pointer;
    padding:12px 14px;line-height:1;flex:0 0 auto}
  .del:hover{color:var(--alert)}
  .btn{padding:12px 18px;border:none;background:var(--done);color:#fff;font-weight:640;
    border-radius:9px;cursor:pointer;font-size:15.5px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.quiet{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .add{display:flex;gap:8px;padding:13px 16px;border-top:1px solid #EDF2F0;background:#FAFCFB}
  .add input{flex:1;min-width:0;padding:11px 12px;font-size:16px;border:1px solid var(--line);border-radius:9px}

  .stepper{display:flex;align-items:center;gap:9px}
  .stepper span{font-size:14px;color:var(--ink-2);min-width:46px;font-weight:550}
  .stepper button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;
    font-size:21px;line-height:1;cursor:pointer}
  .stepper button:disabled{opacity:.35;cursor:default}
  .stepper b{font-size:19px;min-width:2.1em;text-align:center;font-variant-numeric:tabular-nums;font-weight:680}
  .plan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
    margin-bottom:14px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
  .plan p{flex:1 1 100%;margin:0;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);
    padding-top:13px;line-height:1.5}

  .banner{background:#FDF2F3;border:1px solid #F2CBCF;border-radius:var(--r);padding:13px 15px;
    margin-bottom:14px;font-size:15px}
  .banner strong{display:block;margin-bottom:3px}

  .call{display:flex;gap:10px;flex-wrap:wrap;padding:16px}
  .call a{flex:1 1 150px;text-decoration:none;background:var(--alert);color:#fff;padding:14px 15px;
    border-radius:var(--r);font-weight:640;font-size:16px}
  .call a span{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:2px}
  .call a.mail{background:var(--deep)}
  .fields{padding:4px 16px 16px;display:grid;gap:12px}

  .hit{font-size:12.5px;color:var(--ink-2);padding:12px 16px 4px;font-weight:650}
  .empty{color:var(--ink-2);font-size:15px;padding:22px 16px;line-height:1.5}
  .day-top{font-weight:680;font-size:16px;margin-bottom:12px;letter-spacing:-.015em}
  .suggest-row{flex-direction:column;align-items:stretch;padding:14px 16px}
  .suggest-row .txt{margin-bottom:8px}
  .suggest-row a{color:var(--ink);text-decoration:underline}
  .assign{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .toast{position:fixed;left:14px;right:14px;bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom));
    z-index:40;background:var(--deep);color:#fff;border-radius:12px;padding:13px 14px 13px 16px;
    display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(7,42,38,.28);
    max-width:520px;margin:0 auto;font-size:15px}
  .toast[hidden]{display:none}
  /* the update prompt sits above the undo toast so the two never cover each other */
  #updToast{bottom:calc(var(--nav-h) + 78px + env(safe-area-inset-bottom))}
  .toast span{flex:1;min-width:0}
  .toast button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;
    padding:7px 14px;border-radius:99px;font-weight:640;font-size:14px;cursor:pointer;flex:0 0 auto}
  .toast button:hover{background:rgba(255,255,255,.12)}
  footer{max-width:760px;margin:0 auto;padding:0 16px 30px;font-size:12.5px;color:#8FA5A1;line-height:1.5}
  @media (min-width:700px){h1{font-size:32px}}
</style>
</head>
<body>

<header>
  <div class="head-top">
    <div>
      <h1 id="title"></h1>
      <div class="head-sub" id="count"></div>
    <div class="offline-dot"><i></i>Offline — everything still works, sync resumes later</div>
    </div>
    <button class="ghost" id="reset" type="button">Clear ticks</button>
  </div>
  <div class="meter" id="meter"><i style="width:0"></i></div>
</header>
<div class="subnav" id="subnav" hidden></div>

<main>
  <p class="intro" id="intro"></p>
  <input class="search" id="search" type="search" placeholder="Search everything" autocomplete="off">
  <div id="body"></div>
</main>
<footer>Everything is stored on this device. Handover list adapted from a template by segeln-magazin.de.</footer>

<div class="toast" id="toast" hidden role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="undoBtn" type="button">Undo</button>
</div>
<div class="toast" id="updToast" hidden role="status" aria-live="polite">
  <span>A newer version is ready.</span>
  <button id="updBtn" type="button">Reload</button>
</div>

<nav class="bottom" id="tabs" role="tablist"></nav>

<script type="module">

  import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
  import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

  // ── Paste your project's config here (Firebase console → Project settings → Your apps) ──
  // This object is safe to publish — Firebase config is not a secret. Leave apiKey as-is
  // (unchanged) to leave live sync switched off.
  const firebaseConfig = {
    apiKey: "AIzaSyATNoROXlG6SeFYmZrvdNVUc4lsFGEcb7c",
    authDomain: "tiger-and-goat-124ec.firebaseapp.com",
    databaseURL: "https://tiger-and-goat-124ec-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tiger-and-goat-124ec",
    storageBucket: "tiger-and-goat-124ec.firebasestorage.app",
    messagingSenderId: "979026887088",
    appId: "1:979026887088:web:120c5d6560445f6a959675"
  };

  let db=null, ready=false, unsub=null;
  window.__fb = {
    configured: firebaseConfig.apiKey !== "PASTE_ME",
    async init(){
      if(ready || !window.__fb.configured) return;
      const app=initializeApp(firebaseConfig);
      db=getFirestore(app);
      await signInAnonymously(getAuth(app));
      ready=true;
    },
    async push(code,payload){
      if(!ready) await window.__fb.init();
      if(!db) throw new Error("Firebase not configured");
      await setDoc(doc(db,"trips",code), Object.assign({},payload,{updatedAt:serverTimestamp()}));
    },
    async subscribe(code,onData,onErr){
      if(!ready) await window.__fb.init();
      if(!db){ onErr && onErr(new Error("not configured")); return; }
      if(unsub) unsub();
      unsub=onSnapshot(doc(db,"trips",code), snap=>onData(snap.exists()?snap.data():null), onErr);
    },
    unsubscribe(){ if(unsub){ unsub(); unsub=null; } }
  };

/* In an emergency you shouldn't be retyping a number — split the line into dialable chips. */

/* ---- bins: show the actual colours, since that's what you're looking for at the recycling island ---- */
const BIN_COLOURS={yellow:"#E8B93B",blue:"#3B72C4",green:"#3E8E52",brown:"#8A5A33",grey:"#8A9A96",
  gray:"#8A9A96",black:"#3A4644",white:"#FFFFFF",orange:"#E07B2C",red:"#C4453B"};
function binRows(text){
  const parts=String(text||"").split("·").map(s=>s.trim()).filter(Boolean);
  const rows=parts.map(p=>{
    const eq=p.indexOf("=");
    if(eq===-1) return `<span class="bin-note">${esc(p)}</span>`;
    const label=p.slice(0,eq).trim(), what=p.slice(eq+1).trim();
    const key=Object.keys(BIN_COLOURS).find(c=>label.toLowerCase().includes(c));
    const col=key?BIN_COLOURS[key]:null;
    return `<span class="bin">
      <i class="swatch" style="background:${col||"#DCE5E2"};${key==="white"?"border-color:#C9D6D2":""}"></i>
      <b>${esc(label)}</b><span>${esc(what)}</span></span>`;
  });
  return `<span class="bins">${rows.join("")}</span>`;
}
/* ---- weather: pull the times and channels out so they can be scanned ---- */
function wxRows(text){
  const lines=String(text||"").split(". ").map(s=>s.trim()).filter(Boolean)
    .map(s=>s.replace(/\.$/,""));
  return `<span class="wx">${lines.map(l=>{
    let h=esc(l);
    h=h.replace(/\b(\d{1,2}:\d{2})\b/g,'<b class="tag time">$1</b>');
    h=h.replace(/\bch\.? ?(\d{1,2}(?:\/\d{1,2})*)/gi,'<b class="tag ch">ch $1</b>');
    h=h.replace(/\bNAVTEX\b/g,'<b class="tag">NAVTEX</b>');
    return `<span class="wx-line">${h}</span>`;
  }).join("")}</span>`;
}

function emergencyChips(text){
  const parts=String(text).split("·").map(s=>s.trim()).filter(Boolean);
  const out=parts.map(p=>{
    const m=p.match(/(\+?[\d][\d\s]{1,14}\d|\b\d{2,4}\b)/);
    if(!m) return `<span class="echip plain">${esc(p)}</span>`;
    const num=m[1].replace(/\s+/g,"");
    const label=p.replace(m[1],"").replace(/[()]/g,"").trim();
    // VHF channels aren't phone numbers
    if(/vhf|ch\b|channel/i.test(p)) return `<span class="echip plain">${esc(p)}</span>`;
    return `<a class="echip" href="tel:${esc(num)}">${esc(num)}${label?`<i>${esc(label)}</i>`:""}</a>`;
  });
  return `<span class="echips">${out.join("")}</span>`;
}
function tepaiEstimate(m){
  if(!m||m<=7) return null;
  if(m<=8)  return "€16 per month";
  if(m<=10) return "€25 per month";
  if(m<=12) return "€33 per month";
  return "about €"+Math.round(m*8)+" per month (€8 per metre)";
}

      {x:"Helmsman's job", n:"Keep an eye on the crew, keep a lookout, watch the depth sounder, hold the course."},
      {x:"Swimming", n:"Warn about jellyfish, sea urchins and sharp rocks or coral (shoes). Snorkel in pairs only."}]},

{
  id:"packing", tab:"Packing", title:"Packing list", type:"check",
  intro:"Your own kit, not the boat's. Ticks here stay on this device, so every crew member can work through their own copy.",
  sections:[
    {t:"Bags", tips:["Soft bags only. There is nowhere on a yacht to stow a hard suitcase, and charter companies will ask you to leave it ashore."],
     items:[
      {x:"Soft duffel or holdall", n:"Collapses flat and slides under a bunk."},
      {x:"Small dry bag", n:"For the dinghy run — phone, wallet, camera."},
      "Day bag for shopping and shore trips",
      {x:"A few dry sacks or zip bags", n:"Everything below deck eventually meets water."}]},
    {t:"Getting there", tips:["Check what has to go in hold luggage before you pack it — knives and multitools are the usual casualties."],
     items:[
      "Flight or ferry tickets, downloaded offline",
      {x:"Transfer to the marina booked", n:"Charter bases are often well outside town and taxis dry up on Saturdays."},
      {x:"Knife and multitool in hold luggage", n:"They will be taken off you at security otherwise."},
      {x:"Liquids under 100 ml in cabin bags", n:"Sunscreen is the one everyone forgets."},
      {x:"Offline maps of the area downloaded", n:"Do it at home, not on marina wifi."},
      {x:"Photos of passport, licence and insurance in your phone", n:"Saves a scramble if the originals go missing."},
      "Return transfer and flight times noted somewhere the crew can see"]},
    {t:"Papers and money", items:[
      {x:"Sailing licence and radio certificate", n:"The charter company will want to see the originals."},
      "Passport or ID card",
      "Charter confirmation and booking reference",
      {x:"Travel and personal accident insurance", n:"Check it actually covers sailing."},
      "Skipper liability insurance, if you carry it",
      {x:"EHIC or equivalent health card", n:"For EU waters."},
      {x:"Cash for the boat kitty and deposits", n:"Some marinas and fuel docks are cash only."},
      "Bank card that works abroad",
      {x:"Crew list with passport numbers", n:"Needed at check-in and for clearing in."},
      "Emergency contacts for every crew member"]},
    {t:"Skipper's kit", items:[
      {x:"Phone with offline charts downloaded", n:"Download before you leave — not in the marina café."},
      "Power bank and charging cables",
      {x:"Handheld VHF, if you have one", n:"Worth it for the dinghy and for man-overboard."},
      {x:"Head torch with a red mode", n:"Red keeps your night vision."},
      "Notebook and pencils for the log",
      {x:"Dividers and a plotter", n:"Charter boats often have neither, or broken ones."},
      "Pilot book for the area",
      {x:"Rigging knife and a shackle key", n:"On a lanyard, in your pocket."},
      {x:"Small multitool", n:"Hold luggage only — it will be taken off you at security."},
      "Waterproof phone case or pouch",
      {x:"Mileage certificate forms", n:"Easier printed than improvised on the last night."}]},
    {t:"On deck", items:[
      {x:"Non-marking deck shoes", n:"Charter companies check. Black soles leave marks and cost you the deposit."},
      "Sailing gloves",
      {x:"Sun hat with a cord", n:"Without a cord it goes overboard on day one."},
      {x:"Sunglasses with a retainer", n:"Same reasoning."},
      {x:"High-factor sunscreen", n:"Reef-safe if you can — you'll be swimming in it."},
      "Lip balm with sun protection",
      {x:"Spray jacket or light foulies", n:"Even in the Med, a night passage gets cold and wet."},
      "Fleece or midlayer",
      {x:"Your own lifejacket, if you prefer one", n:"Boat ones fit badly and smell of the last crew."},
      {x:"Reef or water shoes", n:"Most Adriatic and Greek beaches are rock and urchins, not sand."},
      {x:"Rash vest or UV top for swimming", n:"Cheaper than reapplying sunscreen all week."}]},
    {t:"Clothes", tips:["Everyone overpacks. You wear swimwear and a t-shirt for six days and one decent outfit for one dinner."],
     items:[
      "T-shirts and quick-dry tops",
      {x:"One long-sleeved light top", n:"Sun protection beats sunscreen on a long leg."},
      "Shorts",
      "Light trousers for the evening",
      {x:"Two sets of swimwear", n:"One is always still wet."},
      "Something presentable for a dinner ashore",
      "Underwear and socks",
      {x:"Fleece or hoodie for the evening", n:"It drops more than you expect after sunset."}]},
    {t:"Washing and sleeping", items:[
      {x:"Quick-dry travel towel", n:"Cotton towels never dry aboard."},
      {x:"Biodegradable soap and shampoo", n:"Some of it ends up in the sea whatever you do."},
      "Toothbrush and toiletries",
      {x:"Earplugs", n:"Halyards, snoring, and the anchor chain at 03:00."},
      {x:"Sleeping bag liner or a light sheet", n:"Ask whether bedding is included before packing one."},
      "Eye mask"]},
    {t:"Health", items:[
      {x:"Seasickness tablets", n:"Take them before you need them, not after."},
      "Personal medication, with a little spare",
      "Plasters and blister plasters",
      {x:"Antiseptic and small dressings", n:"Rope burns and grazes are the usual injuries."},
      "Painkillers",
      {x:"Aloe or after-sun", n:"Someone always catches it on day one."},
      "Insect repellent",
      {x:"Spare glasses or contact lenses", n:"Losing a lens overboard ends your week otherwise."},
      {x:"Fine tweezers and a sterile needle", n:"Sea urchin spines. Croatian and Greek rocks are full of them and nobody packs for it."},
      {x:"Antihistamine tablets and cream", n:"Jellyfish, mosquitoes and whatever you brush against swimming."},
      {x:"Rehydration salts", n:"Heat, beer and a long passage add up faster than people expect."},
      {x:"Ginger sweets or seasickness bands", n:"For anyone who won't take tablets."}]},
    {t:"Between the boat", tips:["Agree who brings what in the crew chat. Nine people each bringing a speaker and nobody bringing tape is the usual outcome."],
     items:[
      {x:"A decent sharp knife", n:"Charter galley knives are famously blunt."},
      {x:"Rigging or duct tape", n:"Fixes more things aboard than anything else you can carry."},
      {x:"WD-40 or a small penetrating spray", n:"Seized shackles, stiff locks, a winch that will not turn."},
      "Cable ties and a few spare shackles",
      {x:"A few metres of spare light line", n:"Flag halyards, fender lanyards, the laundry line, lashing the dinghy."},
      {x:"Bungee cords or short lengths of line", n:"For lashing the dinghy, the fenders and everything else."},
      {x:"Speaker for the cockpit", n:"One is plenty."},
      "Binoculars",
      {x:"Moka pot or cafetière", n:"If nobody wants instant coffee for a week."},
      {x:"Small laundry detergent", n:"A sink wash mid-week beats packing double the clothes."},
      {x:"Laundry line and pegs", n:"Light line between the backstay and a stanchion. Pegs, or the washing ends up in the water."},
      {x:"Solar or USB cockpit lantern", n:"Evenings at anchor without draining the boat batteries."},
      {x:"A couple of clip-on LED lights", n:"The galley and heads are dim at night on most charter boats."},
      {x:"Spare AA and AAA batteries", n:"For torches and whatever aboard has run flat."},
      {x:"Head torches for the crew", n:"There are never enough aboard."},
      {x:"Games or cards", n:"For the evening at anchor."}]},
    {t:"Nice to have", items:[
      "Book or e-reader",
      {x:"Travel adapter", n:"Malta, Cyprus and Gibraltar use UK plugs; the rest of the Med does not."},
      {x:"12 V USB adapter for the cigarette socket", n:"Shore power only works alongside. At anchor the 12 V socket is all you have."},
      {x:"A long charging cable", n:"The only socket is usually at the nav station, nowhere near a bunk."},
      {x:"Phone lanyard or float", n:"Phones go overboard from dinghies, reliably."},
      "Camera",
      {x:"Reusable water bottle", n:"Cuts the plastic you carry aboard enormously."},
      "Snorkel and mask"]}
  ]
},
{
  id:"checkout", tab:"Check-out", title:"Boat check-out", type:"check",
  intro:"Handing the boat back. Start the evening before — check-out always takes longer than anyone expects, and the deposit rides on it.",
  sections:[
    {t:"The evening before", tips:["Almost everything here can be done the night before. Leaving it to the morning is how crews miss flights."],
     items:[
      {x:"Confirm the check-out time with the base", n:"And whether they want the boat stern-to or alongside."},
      {x:"Book a slot at the fuel dock if there is one", n:"In season the queue at 08:00 is long."},
      "Settle the boat kitty and pay anyone back",
      {x:"Start cleaning while the crew are still aboard", n:"Everyone helps the night before. Nobody helps at 07:00.", clean:true},
      "Agree who does what in the morning"]},
    {t:"Fuel, water and tanks", items:[
      {x:"Fill the diesel tank completely", n:"Keep the receipt — charter companies check the level and the timestamp."},
      "Fill the water tanks",
      {x:"Empty the holding tanks", n:"Offshore where it's allowed, or at a pump-out. Leave the valves as the base instructed."},
      "Note the engine hours"]},
    {t:"Galley and fridge", items:[
      {x:"Empty the fridge", n:"Switch it off the night before so it defrosts."},
      {x:"Wipe out the fridge and leave the lid propped", n:"A closed damp fridge greets the next crew with mould.", clean:true},
      {x:"Wash, dry and stow everything", clean:true},
      "Check the cutlery and crockery against the inventory",
      {x:"Bin open food, keep sealed items", n:"Spices and unopened packs can be passed on."},
      {x:"Gather leftovers on the saloon table", n:"List them and leave the list aboard for the next crew."},
      "Turn the gas off at the bottle"]},
    {t:"Below deck", items:[
      {x:"Clear every locker and compartment", n:"Including the spice locker, the bilge and under the bunks."},
      {x:"Clean the heads and showers", clean:true},
      "Drain the shower sumps",
      {x:"Sweep and wipe the saloon and cabins", clean:true},
      {x:"Bedding and towels in one pile in the saloon", n:"Unless the base asked for something else."},
      "Charge the batteries or leave on shore power",
      {x:"Personal gear out of the nav station", n:"Chargers and cables live there and get left behind."}]},
    {t:"On deck", items:[
      "Sails furled and covers on",
      "Sheets and halyards coiled and tidy",
      "Fenders and mooring lines as the base wants them",
      {x:"Rinse the deck and cockpit with fresh water", n:"Salt and sunscreen film is what they notice first.", clean:true},
      {x:"Anchor and chain washed down", n:"Mud in the locker is a common deduction."},
      {x:"Dinghy deflated or hoisted, as instructed", n:"Rinse it and let it dry if you can."},
      {x:"Outboard flushed, drained and locked", n:"Run the fuel out of the carburettor if the base asks."},
      "Bimini and sprayhood stowed or secured",
      "Courtesy and any club flags down",
      "Rubbish ashore — nothing left in a cockpit locker"]},
    {t:"Damage and paperwork", tips:["Report everything, however small. Damage found after you leave is always more expensive than damage you declared."],
     items:[
      {x:"Walk the boat with the base, four eyes", n:"Same as check-in: go round together."},
      {x:"Declare every bit of damage, however minor", n:"With the photos you took at check-in for comparison."},
      {x:"Report larger damage to your organiser or insurer too", n:"Contacts are on the Emergency tab."},
      "Settle small damages from the kitty if that was agreed",
      "Complete the log book",
      {x:"Hand out the mileage certificates", n:"Filled in and signed by you, for the whole crew."},
      "Go through the inventory with the base",
      {x:"Get the deposit release in writing", n:"Or a note of what was deducted and why."},
      "Hand back keys and papers",
      {x:"Sign the check-out form", n:"Read it before signing — it's the record of the boat's condition."}]},
    {t:"Before you walk away", items:[
      {x:"Sweep every bunk, locker and shelf", n:"Phones, chargers, passports and one sock, every single time."},
      "Heads and shower checked for toiletries",
      "Everyone has passport, wallet and phone",
      {x:"Brief the next skipper if they're there", n:"Boat quirks, anything broken, and a photo of the leftovers list."},
      "Transfer or taxi confirmed",
      {x:"Group photo before the crew scatters", n:"Nobody regrets this one."}]}
  ]
},

{
  id:"emergency", tab:"Emergency", title:"After an accident", type:"check", contacts:true,

function numIn(v){
  if(typeof v==="number") return v;
  const s=String(v==null?"":v).trim().replace(/\s/g,"").replace(",",".");
  const x=parseFloat(s);

function crewCount(){ return S.crew.length || S.crewManual; }
function tripDays(){
  const {start,end}=S.trip;
  if(start&&end){ const d=Math.round((new Date(end)-new Date(start))/86400000)+1; if(d>0&&d<60) return d; }
  return S.daysManual;
}
/* ---- who is actually aboard on a given day ----
   On the first day half the crew is often still in transit, so cooking and provisioning
   for the full number wastes food. Anyone without an arrival time counts as aboard. */
function crewAboardOn(dayIdx){
  const n=crewCount();
  if(!S.crew.length || !S.trip.start) return n;
  const day=new Date(S.trip.start);
  if(isNaN(day)) return n;
  day.setDate(day.getDate()+dayIdx);
  day.setHours(20,0,0,0);                       // by the evening meal
  let c=0;
  S.crew.forEach(m=>{
    if(!m.arrival){ c++; return; }              // unknown — assume they're there
    const a=new Date(m.arrival);
    if(isNaN(a) || a<=day) c++;
  });
  return Math.max(1,c);
}
function personDays(){
  const d=tripDays();
  let t=0; for(let i=0;i<d;i++) t+=crewAboardOn(i);
  return t;
}
/* how much of a full-crew trip this actually is — 1 when everyone is there all week */
function presenceFactor(){
  const n=crewCount(), d=tripDays();
  if(!n||!d) return 1;
  const f=personDays()/(n*d);
  return (f>0&&f<=1)?f:1;
}
function dietCount(k){ return S.crew.filter(m=>(m.diet||[]).includes(k)).length; }

/* weighted group sizes — unset profiles count as an average mixed crew member */
function groups(){
  const n=crewCount();
  const g={crew:n,beer:0,wine:0,spirits:0,soft:0,coffee:0,tea:0,
           bfEggs:0,bfMuesli:0,bfBread:0,bfLight:0,plant:0,meat:0};
  const members = S.crew.length ? S.crew : Array.from({length:n},()=>({}));
  const DEF={beer:.6,wine:.5,spirits:.4,soft:.7,coffee:.7,tea:.3};
  const LVL={light:.6,avg:1,big:1.5};
  members.forEach(m=>{
    const diet=m.diet||[], lvl=LVL[m.level||"avg"], noalc=diet.includes("noalc");
    if(m.bf==="eggs") g.bfEggs++;
    else if(m.bf==="muesli") g.bfMuesli++;
    else if(m.bf==="bread") g.bfBread++;
    else if(m.bf==="light") g.bfLight++;
    else if(m.bf!=="none"){ g.bfEggs+=.3; g.bfMuesli+=.3; g.bfBread+=.4; }
    const chosen=(m.drinks&&m.drinks.length)?m.drinks:null;
    Object.keys(DEF).forEach(k=>{
      let v = chosen ? (chosen.includes(k)?1:0) : DEF[k];
      if(noalc&&(k==="beer"||k==="wine"||k==="spirits")) v=0;
      if(k!=="coffee"&&k!=="tea") v*=lvl;
      g[k]+=v;
    });
    if(diet.includes("vegan")||diet.includes("lf")) g.plant++;
    if(!(diet.includes("veg")||diet.includes("vegan"))) g.meat++;
  });
  return g;
}
const WHOLE_UNITS=new Set(["eggs","egg","limes","lime","lemons","loaves","loaf","rolls","roll",
  "pegs","piece","pieces","bulbs","bulb","heads","head","tins","tin","jars","jar","packs","pack",
  "tubs","tub","bottles","bottle","cans","can","cartons","carton","bags","bag","bars","bar","canisters"]);
function rnd(v,u){
  if(u==="g") return Math.max(50,Math.round(v/50)*50);
  if(WHOLE_UNITS.has((u||"").toLowerCase())) return Math.max(1,Math.round(v));
  if(v>=20) return Math.round(v/2)*2;
  if(v>=4)  return Math.round(v);
  return Math.round(v*2)/2;
}
function qtyFor(it){
  const g=groups(), n=crewCount(), d=tripDays();
  const vegans=dietCount("vegan"), gf=dietCount("gf");
  const notes=[];
  if(it.cat==="gluten"&&gf) notes.push(`${gf} gluten-free — add an alternative`);
  const catF = it.cat==="meat" ? g.meat/n : it.cat==="dairy" ? (n-vegans)/n : 1;
  if(it.need && (g[it.need]||0)<0.5)
    return {t:"not needed", free:true, none:true, notes:[`nobody on ${GLABEL[it.need]||it.need}`]};

  if(it.r){
    let lo=0,hi=0;
    const pf=presenceFactor();
    it.r.forEach(t=>{ const c=g[t.g]||0; lo+=c*d*t.d*pf; hi+=c*d*(t.d2||t.d)*pf; });
    lo*=catF; hi*=catF;
    const why=it.r.filter(t=>t.g!=="crew"&&(g[t.g]||0)>=0.5)
                  .map(t=>`${Math.round(g[t.g])} ${GLABEL[t.g]||t.g}`);
    if(why.length) notes.unshift(why.join(", "));
    if(lo<0.4) return {t:"not needed", free:true, none:true, notes};
    const a=rnd(lo,it.u), b=hi>lo*1.15?rnd(hi,it.u):null;
    return {t:nf(a)+(b&&b>a?"–"+nf(b):"")+" "+it.u, notes, lo, hi, unit:it.u};
  }
  if(it.q==null) return {t:catF===0?"not needed":(it.free||""), free:true, none:catF===0, notes};
  if(catF===0) return {t:"not needed", free:true, none:true, notes:[it.cat==="meat"?"nobody eats meat":"all vegan"].concat(notes)};
  if(it.cat==="meat"&&catF<1) notes.unshift(`${Math.round(n-g.meat)} of ${n} don't eat meat`);
  if(it.cat==="dairy"&&vegans) notes.unshift(`${vegans} vegan`);
  const mult=(it.fix?1:(n/9)*(d/8)*presenceFactor())*catF;
  const lo=Math.max(it.q*mult,0.5), hi=it.q2?it.q2*mult:lo;
  const a=rnd(lo,it.u), b=it.q2?rnd(hi,it.u):null;
  return {t:nf(a)+(b&&b>a?"–"+nf(b):"")+" "+it.u, notes, lo, hi, unit:it.u};
}

const UNIT_MAP={g:"g",gram:"g",grams:"g",kg:"kg",kilogram:"kg",kilograms:"kg",kilo:"kg",kilos:"kg",

function parseIngredientLine(line){
  line=(line||"").trim(); if(!line) return null;
  const FRAC={"½":" 1/2","⅓":" 1/3","⅔":" 2/3","¼":" 1/4","¾":" 3/4","⅛":" 1/8"};
  Object.keys(FRAC).forEach(k=>{ line=line.split(k).join(FRAC[k]); });
  const m=line.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)\s+(.*)$/);
  let qty=1, rest=line;
  if(m){
    const qs=m[1].trim();
    if(qs.indexOf("/")!==-1){
      const parts=qs.split(/\s+/);
      if(parts.length===2){ const ab=parts[1].split("/"); qty=numIn(parts[0])+numIn(ab[0])/numIn(ab[1]); }
      else { const ab=qs.split("/"); qty=numIn(ab[0])/numIn(ab[1]); }
    } else qty=numIn(qs);
    rest=m[2].trim();
  }
  const words=rest.split(/\s+/);
  let unit="piece", name=rest;
  if(words.length && UNIT_MAP[words[0].toLowerCase()]){
    unit=UNIT_MAP[words[0].toLowerCase()]; name=words.slice(1).join(" ");
  }
  name=name.replace(/^of\s+/i,"").trim();
  if(!name) name=rest||line;
  return {n:name, q:qty||1, u:unit};
}

/* ---- turning recipe amounts into things you can actually put in a trolley ----

   the other: convert to a base unit, then round up to whole packs. Staples that are

const STAPLE_RE=/\b(salt|pepper|olive oil|sunflower oil|vinegar|sugar|flour|stock|oregano|basil|thyme|rosemary|herb|paprika|cumin|curry powder|chilli|chili|baking powder|soy sauce|mustard|mayonnaise)\b/i;
const SMALL_UNITS=new Set(["pinch","dash","tsp","teaspoon","tbsp","tablespoon","sprig","splash"]);
/* to a base unit: g for solids, ml for liquids */
const TO_BASE={ g:1, kg:1000, ml:1, l:1000, L:1000, oz:28.35, lb:453.6, cup:240 };
/* smallest sensible pack in the shops, by ingredient */
const PACKS=[
  [/risotto rice|arborio/i,      {base:"g",  size:1000, label:"1 kg bag"}],
  [/\brice\b/i,                  {base:"g",  size:1000, label:"1 kg bag"}],
  [/pasta|penne|fusilli|spaghetti|orzo/i, {base:"g", size:500, label:"500 g pack"}],
  [/couscous/i,                  {base:"g",  size:500,  label:"500 g pack"}],
  [/lentils/i,                   {base:"g",  size:500,  label:"500 g pack"}],
  [/oats/i,                      {base:"g",  size:500,  label:"500 g pack"}],
  [/feta|halloumi/i,             {base:"g",  size:200,  label:"200 g pack"}],
  [/grana|parmesan|hard cheese/i,{base:"g",  size:200,  label:"200 g piece"}],
  [/mozzarella/i,                {base:"g",  size:125,  label:"125 g ball"}],
  [/creme fraiche|cream/i,       {base:"g",  size:200,  label:"200 g tub"}],
  [/butter/i,                    {base:"g",  size:250,  label:"250 g pack"}],
  [/yoghurt|yogurt/i,            {base:"g",  size:500,  label:"500 g tub"}],
  [/hummus/i,                    {base:"g",  size:200,  label:"200 g tub"}],
  [/milk/i,                      {base:"ml", size:1000, label:"1 L"}],
  [/tomatoes|courgette|zucchini|aubergine|carrot|potato|onion|pepper|apple|banana|orange|lemon|lime/i,
                                 {base:"g",  size:1000, label:"kg", loose:true}],
  [/falafel/i,                   {base:"pc", size:6,    label:"pack of 6"}],
  [/wrap|flatbread|tortilla/i,   {base:"pc", size:6,    label:"pack of 6"}],
  [/puff pastry|pastry/i,        {base:"pc", size:1,    label:"roll"}],
  [/garlic/i,                    {base:"pc", size:10,   label:"bulb (about 10 cloves)"}],
  [/bread|loaf/i,                {base:"pc", size:1,    label:"loaf"}],
  [/olives|sun-dried|dried tomato/i, {base:"pc", size:1, label:"jar"}]
];
/* countable things you buy one at a time */
const COUNTABLE=new Set(["tin","can","jar","tub","tube","pack","piece","loaf","head","bunch","bottle","clove","ball","roll"]);
function packRule(name){ for(const [re,p] of PACKS) if(re.test(name)) return p; return null; }
function toBase(amt,unit){
  const u=(unit||"").toLowerCase();
  if(u==="clove"||u==="piece"||u==="pc") return {v:amt,base:"pc"};
  const f=TO_BASE[u]!==undefined?TO_BASE[u]:(TO_BASE[unit]!==undefined?TO_BASE[unit]:null);
  if(f===null) return null;
  const base=(u==="ml"||u==="l"||u==="cup")?"ml":"g";
  return {v:amt*f, base};
}
/* Returns what to actually buy, plus what the recipes needed, so you can sanity-check it. */
function toShoppingQty(name,amt,unit){
  const u=(unit||"").toLowerCase();
  if(STAPLE_RE.test(name)) return {staple:true, text:"on your pantry list", need:""};
  if(SMALL_UNITS.has(u))   return {staple:true, text:"a small amount", need:"recipes need "+nf(Math.round(amt*10)/10)+" "+unit};

  const rule=packRule(name), conv=toBase(amt,u);

  if(rule && conv && (rule.base===conv.base || (rule.base==="pc"&&conv.base==="pc"))){
    const packs=Math.max(1,Math.ceil(conv.v/rule.size - 0.001));
    const needTxt="recipes need "+(conv.base==="pc"
      ? nf(Math.round(conv.v*10)/10)+(u==="clove"?" cloves":"")
      : (conv.v>=1000?nf(Math.round(conv.v/100)/10)+" "+(conv.base==="ml"?"L":"kg")
                     :Math.round(conv.v)+" "+conv.base));
    if(rule.loose){
      const kg=Math.max(0.5,Math.round(conv.v/100)/10);
      return {text:nf(kg)+" kg", need:needTxt};
    }
    return {text:packs+" × "+rule.label, need:needTxt};
  }
  if(COUNTABLE.has(u)){
    const whole=Math.max(1,Math.ceil(amt-0.001));
    const plural=whole>1?(u==="bunch"?"bunches":u+"s"):u;
    return {text:whole+" "+plural, need:amt%1>0.05?"recipes need "+nf(Math.round(amt*10)/10)+" "+u:""};
  }
  if(conv){
    const v=conv.v;
    const txt=v>=1000?nf(Math.round(v/100)/10)+" "+(conv.base==="ml"?"L":"kg"):Math.round(v)+" "+conv.base;
    return {text:txt, need:""};
  }
  return {text:nf(Math.round(amt*10)/10)+" "+(unit||""), need:""};
}

const ING_SYN=[
  [/\bzucchinis?\b/g,"courgette"],[/\beggplants?\b/g,"aubergine"],
  [/\bgarbanzos?( beans?)?\b/g,"chickpeas"],[/\bbell peppers?\b/g,"pepper"],
  [/\bcapsicums?\b/g,"pepper"],[/\bscallions?\b/g,"spring onion"],
  [/\bcilantro\b/g,"coriander"],[/\byogh?urts?\b/g,"yoghurt"],
  [/\bcourgettes\b/g,"courgette"],[/\bshrimps?\b/g,"prawns"],
  [/\bminced? garlic\b/g,"garlic"],[/\bgarlic cloves?\b/g,"garlic"],
  [/\bspring onions\b/g,"spring onion"],
  // "feta cheese" and "feta" are the same shelf item; "cream cheese" is not "cream"
  [/\b(feta|mozzarella|cheddar|parmesan|halloumi|goat'?s?|ricotta|gruyere) cheese\b/g,"$1"]
];
/* purely cosmetic words — safe to ignore when matching */
const ING_DROP=new Set(["fresh","organic","large","small","medium","ripe","free-range","extra",
  "good","quality","whole","raw","plain","natural","finely","roughly","thinly","peeled","washed",
  "of","a","the","some","your","favourite","favorite","best"]);
function singular(w){
  if(w.length<4) return w;
  if(/oes$/.test(w)) return w.slice(0,-2);
  if(/ies$/.test(w)) return w.slice(0,-3)+"y";
  if(/ss$/.test(w)) return w;
  if(/s$/.test(w))  return w.slice(0,-1);
  return w;
}
/* Automatic matching only handles the obvious cases. Anything arguable is left to you:
   these two maps hold your decisions, and they sync to the crew like everything else. */
function aliasMap(){ S.aliases=S.aliases||{}; return S.aliases; }
function dupMap(){ S.dups=S.dups||{}; return S.dups; }
function canonKey(name){
  const c=canonIngredient(name), a=aliasMap();
  let k=c, guard=0;
  while(a[k] && a[k]!==k && guard++<6) k=a[k];   // follow a chain, but never loop
  return k;
}
function canonIngredient(name){
  let s=(name||"").toLowerCase().trim();
  s=s.replace(/\([^)]*\)/g," ");             // "(tins)" etc
  s=s.replace(/[.,;]/g," ");
  s=s.replace(/^[\d\s\/-]+/,"");             // "2 ripe tomatoes" → "ripe tomatoes"
  s=s.replace(/^(g|kg|ml|l|oz|lb|tsp|tbsp|cups?|tins?|cans?|jars?|packs?|cloves?|pieces?|bunch(es)?)\s+/,"");
  ING_SYN.forEach(([re,to])=>{ s=s.replace(re,to); });
  s=s.split(/\s+/).filter(w=>w&&!ING_DROP.has(w)).map(singular).join(" ");
  return s.trim();
}
/* units that mean the same shelf item, so amounts can be added together */
function unitClass(u){
  u=(u||"").toLowerCase();
  if(["g","kg","oz","lb"].includes(u)) return "mass";
  if(["ml","l","cup","fl oz"].includes(u)) return "vol";
  if(["piece","pc","clove","pcs",""].includes(u)) return "count";
  if(["tin","can","tins","cans"].includes(u)) return "tin";
  return u.replace(/s$/,"");
}
const CLASS_UNIT={mass:"g", vol:"ml", count:"piece", tin:"tin"};

function mealExtras(){
  const map={}; let count=0; const n=crewCount(); const live=[];
  const add=(name,qty,unit,from)=>{
    const cls=unitClass(unit);
    let amount=qty, u=CLASS_UNIT[cls]||unit;
    if(cls==="mass"||cls==="vol"){
      const c=toBase(qty,unit);
      if(c){ amount=c.v; u=c.base; }
    }
    const key=canonKey(name)+"|"+cls;
    if(!map[key]) map[key]={n:name, u, q:0, c:0, cls, from:[]};
    if(from && map[key].from.indexOf(from)===-1) map[key].from.push(from);
    // keep the shortest spelling as the label — usually the plainest
    if(name.length<map[key].n.length) map[key].n=name;
    map[key].q+=amount; map[key].c++;
  };
  Object.keys(S.meals||{}).forEach(day=>{
    if(+day>=tripDays()) return;
    const slots=S.meals[day];
    ["lunch","dinner"].forEach(meal=>{
      const s=slots&&slots[meal];
      if(s&&s.type==="recipe"&&s.recipe){
        const r=allRecipes().find(x=>x.id===s.recipe); if(!r) return;
        count++;
        const aboard=crewAboardOn(+day);
        r.ingr.forEach(ing=>add(ing.n, ing.q*aboard, ing.u, r.name));
      } else if(s&&s.type==="live"&&s.live){
        count++;
        live.push({name:s.live.name,url:s.live.url,day:+day,meal});
      }
    });
  });
  return {items:Object.values(map), count, live};
}

/* ---- live suggestions (calls Claude, with web search, from inside the artifact) ---- */
async function suggestRecipes(){
  liveLoading=true; liveError=""; render();
  const need=[];
  if(crewNeeds().includes("vegan")) need.push("vegan");
  else if(crewNeeds().includes("veg")) need.push("vegetarian");
  if(crewNeeds().includes("gf")) need.push("gluten-free");
  if(crewNeeds().includes("lf")) need.push("dairy-free");
  if(crewNeeds().includes("nopork")) need.push("no pork");
  const allergies=allergyList().map(a=>a.text).join("; ");
  const prompt=`Suggest 5 real recipes simple enough to cook aboard a small sailing boat (one stovetop, small fridge, limited pans). Crew of ${crewCount()} for ${tripDays()} days.
Dietary constraints that must ALL be met: ${need.length?need.join(", "):"none specific"}.
Allergies or foods to avoid across the crew: ${allergies||"none stated"}.
Use web search to find real recipes that fit. For each, use the recipe's real title and a working source URL you found.
Respond with ONLY a JSON array and nothing else — no markdown fences, no commentary. Each item: {"name": string, "type": "lunch" or "dinner", "blurb": a single short original sentence (under 15 words) describing the dish in your own words, "url": string}.`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-6", max_tokens:1000,
        messages:[{role:"user",content:prompt}],
        tools:[{type:"web_search_20250305",name:"web_search"}]
      })
    });
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const s=text.indexOf("["), e=text.lastIndexOf("]");
    const arr = s!==-1&&e!==-1 ? JSON.parse(text.slice(s,e+1)) : null;
    liveSuggestions = Array.isArray(arr) ? arr.filter(x=>x&&x.name&&x.url&&x.type) : [];
    if(!liveSuggestions.length) liveError="No matching recipes came back — try again.";
  }catch(err){
    liveError="Couldn't reach the suggestion service just now — try again in a moment.";
  }
  liveLoading=false; render();
}
function liveRow(s,i){
  const d=tripDays(), opts=[];
  for(let day=0; day<d; day++){
    if(s.type!=="dinner") opts.push(`<option value="${day}|lunch">${esc(dayLabel(day))} — Lunch</option>`);
    if(s.type!=="lunch") opts.push(`<option value="${day}|dinner">${esc(dayLabel(day))} — Dinner</option>`);
  }
  return `<li class="suggest-row">
    <span class="txt"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>
      <span class="note">${esc(s.blurb)}</span></span>
    <select class="assign" data-live="${i}">
      <option value="">Assign to a meal…</option>${opts.join("")}
    </select>
  </li>`;
}
function liveSuggestionsHTML(){
  if(liveLoading) return `<div class="panel"><p style="font-size:14px;color:var(--ink-2);margin:0">Searching for recipes that fit your crew…</p></div>`;
  if(liveError) return `<div class="panel"><p style="font-size:14px;color:var(--alert);margin:0">${esc(liveError)}</p></div>`;
  if(!liveSuggestions.length) return "";
  return `<section><button class="sec-head" data-sec="x"><span class="sec-title">Suggested just now</span></button>
    <ul>${liveSuggestions.map((s,i)=>liveRow(s,i)).join("")}</ul></section>`;
}

/* Which standing-list items does this ingredient already duplicate? */

/* Ingredients that duplicate a standing-list item shouldn't just be marked "covered" —
   the list item has to grow by what the cooking needs, or you buy 3 L of milk and
   then use 2 L of it in the risotto. */
const COUNT_UNITS=new Set(["eggs","egg","limes","lime","lemons","loaves","loaf","pegs","piece","pieces",
  "rolls","roll","bulbs","bulb","heads","head","pieces"]);
function mealCover(){
  const out={};
  const me=mealExtras();
  me.items.forEach(it=>{
    const dup=alsoOnList(it.n);
    if(!dup) return;
    const key=canonIngredient(dup.item);
    out[key]=out[key]||{q:0,u:it.u,names:[],from:[]};
    if(out[key].u===it.u) out[key].q+=it.q;
    out[key].names.push(it.n);
    (it.from||[]).forEach(f=>{ if(out[key].from.indexOf(f)===-1) out[key].from.push(f); });
  });
  return out;
}
/* express a base amount (g / ml / piece / tin) in the list item's own unit */
function inUnit(amount, fromUnit, targetUnit){
  const f=(fromUnit||"").toLowerCase(), t=(targetUnit||"").toLowerCase();
  if(f===t) return amount;
  const massVol=u=>["g","kg","ml","l","oz","lb","cup"].includes(u);
  if(massVol(f)&&massVol(t)){
    const fb=TO_BASE[f], tb=TO_BASE[t];
    if(fb&&tb){
      const fClass=(f==="ml"||f==="l"||f==="cup")?"vol":"mass";
      const tClass=(t==="ml"||t==="l"||t==="cup")?"vol":"mass";
      if(fClass===tClass) return amount*fb/tb;
    }
    return null;
  }
  if(f==="piece" && (COUNT_UNITS.has(t)||t==="")) return amount;
  if(unitClass(f)===unitClass(t)) return amount;
  return null;
}

function alsoOnList(name){
  const c=canonIngredient(name);
  if(!c) return null;
  const manual=dupMap()[c];
  if(manual) return {item:manual.item, sec:manual.sec, manual:true};
  if(manual===null) return null;
  const prov=DATA.find(d=>d.id==="provisions");
  let hit=null;
  prov.sections.forEach((sec,si)=>sec.items.forEach((raw,ii)=>{
    if(hit) return;
    if(S.hidden&&S.hidden[idOf(DATA.indexOf(prov),si,ii)]) return;
    const it=norm(raw), ic=canonIngredient(it.x);
    if(!ic) return;
    if(ic===c) hit={item:it.x, sec:sec.t};   // exact only — "oat milk" is not "milk"
  }));
  return hit;
}
function provisionItems(){
  const prov=DATA.find(d=>d.id==="provisions"), li=DATA.indexOf(prov), out=[];
  prov.sections.forEach((sec,si)=>sec.items.forEach((raw,ii)=>{
    if(S.hidden&&S.hidden[idOf(li,si,ii)]) return;
    const it=norm(raw); out.push({name:it.x, sec:sec.t});
  }));
  return out;
}
/* Rank likely matches so the common case is one tap, not a hunt through a long list. */
function matchScore(a,b){
  const ta=canonIngredient(a).split(" ").filter(Boolean);
  const tb=canonIngredient(b).split(" ").filter(Boolean);
  if(!ta.length||!tb.length) return 0;
  const shared=ta.filter(w=>tb.includes(w)).length;
  if(!shared) return 0;
  return shared/Math.max(ta.length,tb.length);
}
function mergeSuggestions(name){
  return provisionItems()
    .map(p=>({...p, s:matchScore(name,p.name)}))
    .filter(p=>p.s>=0.34 && canonIngredient(p.name)!==canonIngredient(name))
    .sort((x,y)=>y.s-x.s).slice(0,3);
}
function mergePicker(it,others){
  const c=canonIngredient(it.n), a=aliasMap(), d=dupMap();
  const cur = a[c] ? "m:"+a[c] : (d[c]&&d[c].item ? "p:"+d[c].sec+"|"+d[c].item : (d[c]===null?"x":""));
  const sug=cur===""?mergeSuggestions(it.n):[];
  return `${sug.length?`<span class="sug">Same as
    ${sug.map(p=>`<button class="chip" type="button" data-quickmerge="${esc(c)}"
        data-sec="${esc(p.sec)}" data-item="${esc(p.name)}">${esc(p.name)}?</button>`).join("")}
    <button class="chip" type="button" data-quickmerge="${esc(c)}" data-no="1">No, separate</button>
  </span>`:""}
  <select class="assign" data-merge="${esc(c)}" style="margin:0 14px 12px;width:calc(100% - 28px)">
    <option value="" ${cur===""?"selected":""}>Own line — buy separately</option>
    <option value="x" ${cur==="x"?"selected":""}>Not a duplicate (stop suggesting)</option>
    ${others.length?`<optgroup label="Same as another ingredient">${others.map(o=>
      `<option value="m:${esc(o.key)}" ${cur==="m:"+o.key?"selected":""}>Count with ${esc(o.n)}</option>`).join("")}</optgroup>`:""}
    <optgroup label="Already on my shopping list">${provisionItems().map(p=>
      `<option value="p:${esc(p.sec)}|${esc(p.name)}" ${cur==="p:"+p.sec+"|"+p.name?"selected":""}>${esc(p.name)} — ${esc(p.sec)}</option>`).join("")}</optgroup>
  </select>`;
}
function extraRow(it,others){
  const id="mealx."+slug(it.n), on=!!S.done[id];
  const buy=toShoppingQty(it.n,it.q,it.u);
  const dup=alsoOnList(it.n);
  const sub=[`for ${it.c} planned meal${it.c>1?"s":""}`, buy.need,
             dup?`added to ${esc(dup.item)} on your ${esc(dup.sec)} list`:""].filter(Boolean).join(" · ");
  return `<li class="${buy.staple||dup?"off":""}" style="${editMode?"flex-wrap:wrap":""}">
    <label class="tick"><input type="checkbox" data-id="${id}" ${on?"checked":""}>
    <span class="txt">${esc(it.n)}<span class="note diet">${esc(sub)}</span></span></label>
    <div class="qty"><span class="rec ${buy.staple||dup?"free":""}">${dup?"covered":esc(buy.text)}</span></div>
    ${editMode?mergePicker(it,(others||[]).filter(o=>o.key!==canonKey(it.n))):""}
  </li>`;
}

function sectionHTML(l,si,sec){
  const shop=DATA[l].type==="shop";
  let mine=shop ? (S.custom||[]).filter(c=>c.sec===sec.t) : [];
  if(shop&&hideTicked) mine=mine.filter(c=>!S.done["custom."+c.id]);
  const cleanSkip = DATA[l].id==="checkout" && S.trip.cleaningBooked;
  const visible=sec.items.map((raw,ii)=>({raw,ii,id:idOf(l,si,ii)}))
                         .filter(o=>!(shop&&S.hidden&&S.hidden[o.id]))
                         .filter(o=>!(shop&&hideTicked&&S.done[o.id]))
                         .filter(o=>!(cleanSkip&&norm(o.raw).clean));
  const nHidden=sec.items.length-visible.length;
  const allIds=sec.items.map((raw,ii)=>({raw,id:idOf(l,si,ii)}))
    .filter(o=>!(cleanSkip&&norm(o.raw).clean)).map(o=>o.id)
    .filter(id=>!(shop&&S.hidden&&S.hidden[id]))
    .concat(shop?(S.custom||[]).filter(c=>c.sec===sec.t).map(c=>"custom."+c.id):[]);
  const ids=allIds;
  const done=ids.filter(i=>S.done[i]).length;
  const open=!collapsed[l+"."+si];
  return `<section>
    <button class="sec-head ${ids.length&&done===ids.length?"complete":""} ${open?"":"closed"}" data-sec="${si}">
      ${DATA[l].numbered?`<span class="step">${si+1}</span>`:(shop&&SEC_ICON[sec.t]?ico(SEC_ICON[sec.t]):"")}
      <span class="sec-title">${esc(sec.t)}${sec.when?`<span class="sec-when">${esc(sec.when)}</span>`:""}</span>
      <span class="sec-count">${ids.length?done+"/"+ids.length:(sec.tips?"tips":"")}</span>
      <span class="chev"></span>
    </button>
    ${sec.warn?`<div class="warn"><strong>Important</strong>${esc(sec.warn)}</div>`:""}
    ${open&&sec.tips?`<div class="tips">${sec.tips.map(p=>`<p>${esc(p)}</p>`).join("")}</div>`:""}
    ${open&&(visible.length||mine.length)?`<ul>${visible.map(o=>row(o.id,norm(o.raw),shop)).join("")}${mine.map(customRow).join("")}</ul>`
      :(open&&shop&&hideTicked&&ids.length?`<div class="empty" style="padding:14px 16px">All done in here.</div>`:"")}
    ${open&&shop&&sec.items.length?`<div class="add">
      <input data-addname="${si}" placeholder="Add to ${esc(sec.t)}" autocomplete="off">
      <input data-addqty="${si}" placeholder="amount" style="flex:0 0 88px" autocomplete="off">
      <button class="btn" data-addbtn="${si}" type="button">Add</button>
    </div>`:""}
    ${open&&nHidden?`<div class="tips"><p>${nHidden} item${nHidden>1?"s":""} removed ·
      <a href="#" data-restore="${si}" style="color:var(--done)">put back</a></p></div>`:""}
  </section>`;
}
function chipRow(label,opts,sel,attr,id,multi,cls){
  return `<div class="rowlab">${label}</div><div class="chips">${opts.map(o=>
    `<button class="chip ${cls||""}" data-${attr}="${o.k}" data-id="${id}"
      aria-pressed="${multi?sel.includes(o.k):sel===o.k}">${o.l}</button>`).join("")}</div>`;
}
function memberSummary(m){
  const bits=[];
  const bf=BREAKFAST.find(x=>x.k===m.bf); if(bf) bits.push(bf.l.split(" ")[0]);
  if((m.drinks||[]).length) bits.push(m.drinks.map(k=>(DRINKS.find(d=>d.k===k)||{}).l).filter(Boolean)
    .map(l=>l.split(" ")[0]).join(", "));
  if(m.level==="big") bits.push("drinks a lot"); else if(m.level==="light") bits.push("drinks little");
  return bits.join(" · ");
}

function profileSummary(){
  const g=groups(), out=[];
  const bf=[["bfEggs","savoury"],["bfBread","bread"],["bfMuesli","muesli"],["bfLight","light"]]
    .filter(([k])=>g[k]>=0.5).map(([k,l])=>`${Math.round(g[k])} ${l}`);
  if(bf.length) out.push("Breakfast: "+bf.join(", "));
  const dr=[["beer","beer"],["wine","wine"],["spirits","spirits"],["soft","soft drinks"],["coffee","coffee"],["tea","tea"]]
    .filter(([k])=>g[k]>=0.5).map(([k,l])=>`${Math.round(g[k])} ${l}`);
  if(dr.length) out.push("Drinks: "+dr.join(", "));
  return out;
}

        ? `<p style="font-size:14px;color:var(--ink-2);margin:0 0 10px">Trip code <b style="color:var(--ink);letter-spacing:.06em">${esc(S.tripCode)}</b> ·
             <span style="color:${(fbStatus||"").indexOf("error")!==-1?"var(--alert)":"var(--done)"}">${esc(fbStatus||"Connecting…")}</span></p>

/* ---- sharing: the picked fields are pushed to Firestore for live sync ---- */
const SHARE_FIELDS=["trip","crew","meals","customRecipes","own","custom","crewManual","daysManual","c","hidden","kitty","aliases","dups"];
/* Provisioning is one shared errand — whoever is at the shop ticks, everyone sees it.
   Ticks on the personal lists (packing, safety, handover…) stay on this device, so
   only the three id prefixes the shop tab uses travel. */
const SHOP_TICK=/^(provisions\.|custom\.|mealx\.)/;
function shopDone(done){ const p={}; Object.keys(done||{}).forEach(k=>{ if(SHOP_TICK.test(k)) p[k]=done[k]; }); return p; }
function pickShare(){ const p={}; SHARE_FIELDS.forEach(k=>{ if(S[k]!==undefined) p[k]=S[k]; }); p.doneShop=shopDone(S.done); return p; }
function applyShare(payload){
  SHARE_FIELDS.forEach(k=>{ if(payload[k]!==undefined) S[k]=payload[k]; });
  if(payload.doneShop!==undefined){
    // Keep this device's private ticks, swap in the crew's shopping ones.
    const keep={}; Object.keys(S.done||{}).forEach(k=>{ if(!SHOP_TICK.test(k)) keep[k]=S.done[k]; });
    S.done=Object.assign(keep,shopDone(payload.doneShop));
  }
  save();
}

function fbConfigured(){ return !!(window.__fb && window.__fb.configured); }
function genCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s=""; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function subscribeFb(code){
  window.__fb.subscribe(code, data=>{
    if(data){
      const incoming=JSON.stringify(shareSubset(data));
      if(incoming===lastPushedJSON) return; // our own write echoing back — ignore, don't disturb typing
      if(pendingPush) return; // we have unsent local edits; don't let a stale snapshot overwrite them
      syncingRemote=true; applyShare(data); syncingRemote=false;
      fbStatus="Updated from another device.";
      if(isTyping()) pendingRender=true; else render();
    } else {
      fbStatus="Synced just now"; if(!isTyping()) renderTrip();
    }
  }, err=>{ fbStatus="Sync error — check your connection."; if(!isTyping()) renderTrip(); });
}
async function fbStart(){
  const have=await waitForFb();
  if(!have || !fbConfigured()){ fbStatus="Firebase isn't configured yet."; renderTrip(); return; }
  const code=genCode();
  fbStatus="Connecting…"; S.tripCode=code; renderTrip();
  try{ await fbPush(); fbStatus="Synced just now"; subscribeFb(code); renderTrip(); }
  catch(e){ fbStatus="Couldn't start live sync — check your Firebase setup."; renderTrip(); }
}
function fbStop(){
  if(window.__fb) window.__fb.unsubscribe();
  S.tripCode=""; fbStatus=""; lastPushedJSON=null; save(); render();
}
async function fbCopyLink(){

}

/* ---- boat kitty: contributions, spending, and who settles what ---- */
function kittyState(){ S.kitty=S.kitty||{cur:"€",contrib:{},expenses:[]};
  S.kitty.contrib=S.kitty.contrib||{}; S.kitty.expenses=S.kitty.expenses||[]; return S.kitty; }
function kittyMembers(){
  const k=kittyState();
  if(S.crew.length) return S.crew.map(m=>({id:m.id,name:m.name||"Crew member"}));
  // no roster yet — fall back to whoever appears in the kitty data
  const ids=new Set(Object.keys(k.contrib));
  k.expenses.forEach(e=>{ if(e.by&&e.by!=="kitty") ids.add(e.by); });
  return [...ids].map(id=>({id,name:"Crew member"}));
}
function kittyMaths(){
  const k=kittyState(), mem=kittyMembers(), n=mem.length||1;
  const num=v=>{ const x=numIn(v); return isNaN(x)?0:x; };
  const contributed=mem.reduce((s,m)=>s+num(k.contrib[m.id]),0);
  const spent=k.expenses.reduce((s,e)=>s+num(e.amt),0);
  const fromKitty=k.expenses.filter(e=>e.by==="kitty").reduce((s,e)=>s+num(e.amt),0);
  const share=spent/n;
  const people=mem.map(m=>{
    const paid=num(k.contrib[m.id])+k.expenses.filter(e=>e.by===m.id).reduce((s,e)=>s+num(e.amt),0);
    return {...m, paid, balance:paid-share};
  });
  return {contributed, spent, fromKitty, pot:contributed-fromKitty, share, people, n};
}
const CUR_SYMBOL={tr:"₺",al:"L",ba:"KM",il:"₪",eg:"E£",tn:"DT",dz:"DA",ma:"DH",
  gi:"£",lb:"$",sy:"£S",ly:"LD"};
function curSymbol(){
  const k=kittyState();
  if(k.cur && k.cur!=="€") return k.cur;          // explicit choice wins
  return CUR_SYMBOL[S.trip.country] || "€";        // otherwise follow the country
}
function money(v){ return curSymbol()+Math.abs(v).toFixed(2); }

function shopEstimate(){
  const n=crewCount(), d=tripDays(), g=groups();
  const beerF=g.beer/(n*0.6||1);
  const base=(n/9)*(d/8)*presenceFactor()*(0.7+0.3*beerF);
  return {lo:Math.round(500*base/10)*10, hi:Math.round(1000*base/10)*10};
}

  const debts=owe.map(p=>({name:p.name,amt:-p.balance}));
  const creds=due.map(p=>({name:p.name,amt:p.balance}));
  if(M.pot<-0.005) creds.push({name:"the kitty",amt:-M.pot});
  else if(M.pot>0.005) debts.push({name:"the kitty",amt:M.pot});
  const transfers=settleUp(debts,creds);
  html+=`<section>

      <div class="qty"><span class="rec ${p.balance<-0.005?"":"free"}" style="${p.balance<-0.005?"background:#FDF2F3;color:var(--alert)":""}">

    ${transfers.length?`<div class="tips"><p><b>Simplest way to settle:</b><br>${

    }</p></div>`:""}
    <div class="tips"><p>The kitty covers shared costs — fuel, moorings, the big shop. Personal extras stay off this list.</p></div>
  </section>`;
  bodyEl.innerHTML=html;
}
function settleUp(debts,creds){
  debts=debts.slice(); creds=creds.slice();
  const out=[]; let i=0,j=0;
  while(i<debts.length&&j<creds.length){
    const amt=Math.min(debts[i].amt,creds[j].amt);
    if(amt>0.005) out.push({from:debts[i].name,to:creds[j].name,amt});
    debts[i].amt-=amt; creds[j].amt-=amt;
    if(debts[i].amt<0.005) i++;
    if(creds[j].amt<0.005) j++;
  }
  return out;
}

  const k=kittyState();
  const now=new Date();
  k.expenses.push({id:Date.now().toString(36), desc, amt,
    by:b?b.value:"kitty", date:now.toLocaleDateString("en-GB",{day:"numeric",month:"short"})});
  save(); render();
  const nd=$("expDesc"); if(nd) nd.focus();
}

function renderSearch(){
  const q=query.toLowerCase(); let html="",hits=0;
  DATA.forEach((l,li)=>{
    if(!l.sections) return;
    let inner="";
    l.sections.forEach((sec,si)=>sec.items.forEach((raw,ii)=>{
      const it=norm(raw), id=idOf(li,si,ii);
      if(l.type==="shop"&&S.hidden&&S.hidden[id]) return;   // removed from the list — don't resurrect it in search
      if((it.x+" "+(it.n||"")+" "+sec.t).toLowerCase().includes(q)){ inner+=row(id,it,l.type==="shop"); hits++; }
    }));
    if(l.type==="shop"){
      (S.custom||[]).forEach(c=>{
        if((c.x+" "+(c.sec||"")).toLowerCase().includes(q)){ inner+=customRow(c); hits++; }
      });
    }
    if(inner) html+=`<section><div class="hit">${esc(l.title)}</div><ul>${inner}</ul></section>`;
  });
  bodyEl.innerHTML=hits?html:`<p class="empty">Nothing matches “${esc(query)}”.</p>`;
}
/* Rebuilding innerHTML destroys the focused field, so remember where the cursor
   was and put it back afterwards. Without this, typing anywhere jumps around. */
function focusKey(el){
  if(!el || !bodyEl.contains(el)) return null;
  const tag=el.tagName.toLowerCase();
  if(!/^(input|select|textarea)$/.test(tag)) return null;
  if(el.id) return "#"+el.id;
  let sel=tag;
  for(let i=0;i<el.attributes.length;i++){
    const a=el.attributes[i];
    if(a.name.indexOf("data-")===0) sel+='['+a.name+'="'+a.value.replace(/"/g,'\\"')+'"]';
  }
  return sel===tag?null:sel;
}
function withFocus(fn){
  const el=document.activeElement, key=focusKey(el);
  let start=null,end=null;
  if(key){ try{ start=el.selectionStart; end=el.selectionEnd; }catch(e){} }
  fn();
  if(!key) return;
  let next=null; try{ next=bodyEl.querySelector(key); }catch(e){}
  if(!next) return;
  try{ next.focus({preventScroll:true}); }catch(e){ next.focus(); }
  if(start!=null && next.setSelectionRange){
    try{ next.setSelectionRange(start,end); }catch(e){}
  }
}
function isTyping(){
  const el=document.activeElement;
  return !!(el && bodyEl.contains(el) && /^(input|textarea|select)$/i.test(el.tagName));
}
let pendingRender=false;
function render(){
  withFocus(()=>{
    renderTabs(); renderHead();
    if(query.trim()&&!isForm(active)){ introEl.style.display="none"; renderSearch(); }
    else{ introEl.style.display=""; renderList(); }
  });
}
/* If a remote update lands mid-typing, hold the redraw until the field is left. */
document.addEventListener("focusout",e=>{
  if(e.target&&e.target.dataset&&e.target.dataset.contrib&&DATA[active].type==="kitty"){
    setTimeout(()=>{ if(!isTyping()) render(); },120);
  }
  setTimeout(()=>{ if(pendingRender && !isTyping()){ pendingRender=false; render(); } },120);
});

bodyEl.addEventListener("change",e=>{
  const liveSel=e.target.closest("select[data-live]");
  if(liveSel){
    const idx=+liveSel.dataset.live, val=liveSel.value;
    if(!val) return;
    const [day,meal]=val.split("|");
    const s=liveSuggestions[idx]; if(!s) return;
    S.meals[day]=S.meals[day]||{};
    S.meals[day][meal]={type:"live",recipe:"",live:{name:s.name,url:s.url,blurb:s.blurb}};
    save(); render();
    return;
  }
  if(e.target.id==="drType"){ draftRecipe.type=e.target.value; return; }
  const mg=e.target.closest("select[data-merge]");
  if(mg){
    const c=mg.dataset.merge, v=mg.value, a=aliasMap(), d=dupMap();
    delete a[c]; delete d[c];
    if(v==="x") d[c]=null;                                   // you've said it's not a duplicate
    else if(v.indexOf("m:")===0) a[c]=v.slice(2);            // merge into another ingredient
    else if(v.indexOf("p:")===0){
      const [sec,item]=v.slice(2).split("|"); d[c]={sec,item};
    }
    save(); render(); return;
  }
  const sel=e.target.closest("select[data-day]");
  if(sel){
    const day=+sel.dataset.day, meal=sel.dataset.meal, val=sel.value;
    S.meals[day]=S.meals[day]||{};
    if(val==="") S.meals[day][meal]={type:"",recipe:""};
    else if(val==="out") S.meals[day][meal]={type:"out",recipe:""};
    else if(val==="simple") S.meals[day][meal]={type:"simple",recipe:""};
    else if(val.indexOf("r:")===0) S.meals[day][meal]={type:"recipe",recipe:val.slice(2)};
    save(); render();
    return;
  }
  const cb=e.target.closest("input[type=checkbox]");
  if(cb){
    if(cb.checked) S.done[cb.dataset.id]=1; else delete S.done[cb.dataset.id];
    save(); renderHead();
    const head=cb.closest("section")?.querySelector(".sec-head[data-sec]");
    if(head&&head.dataset.sec!=="x"&&!query.trim()){
      const si=head.dataset.sec, shop=DATA[active].type==="shop";
      const sec=DATA[active].sections[si];
      let ids=sec.items.map((_,ii)=>idOf(active,si,ii)).filter(id=>!(shop&&S.hidden&&S.hidden[id]));
      if(shop) ids=ids.concat((S.custom||[]).filter(c=>c.sec===sec.t).map(c=>"custom."+c.id));
      const d=ids.filter(i=>S.done[i]).length;
      head.querySelector(".sec-count").textContent=d+"/"+ids.length;
      head.classList.toggle("complete",ids.length>0&&d===ids.length);
    }
    return;
  }
  const dt=e.target.closest("input[data-t]");
  if(dt&&(dt.dataset.t==="start"||dt.dataset.t==="end")){ S.trip[dt.dataset.t]=dt.value; save(); if(!isTyping()) render(); else pendingRender=true; }
  const cs=e.target.closest("select[data-t='country']");
  if(cs){ S.trip.country=cs.value; save(); render(); }
  const ar=e.target.closest("input[data-f='arrival']");
  if(ar){ const m=S.crew.find(x=>x.id===ar.dataset.id); if(m){ m.arrival=ar.value; save(); if(!isTyping()) render(); else pendingRender=true; } }
});
bodyEl.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.own!=null){ const k=t.dataset.own; t.value.trim()?S.own[k]=t.value:delete S.own[k]; save(); return; }
  if(t.dataset.contrib){ const kk=kittyState(); const v=t.value.trim();

    save(); renderHead(); return; }
  if(t.dataset.c){ S.c[t.dataset.c]=t.value; save(); return; }
  if(t.dataset.t&&t.dataset.t!=="start"&&t.dataset.t!=="end"){ S.trip[t.dataset.t]=t.value; save(); return; }
  if(t.dataset.f&&t.dataset.f!=="arrival"){ const m=S.crew.find(x=>x.id===t.dataset.id); if(m){ m[t.dataset.f]=t.value; save(); } }
  if(t.id==="spoonKey"){ S.spoonKey=t.value.trim(); save(); return; }
  if(t.id==="drName"){ draftRecipe.name=t.value; return; }
  if(t.id==="drUrl"){ draftRecipe.url=t.value; return; }
  if(t.id==="drBlurb"){ draftRecipe.blurb=t.value; return; }
  if(t.id==="drServes"){ draftRecipe.serves=t.value; return; }
  if(t.dataset.ing){ const i=+t.dataset.i; if(draftRecipe.ingr[i]) draftRecipe.ingr[i][t.dataset.ing]=t.value; return; }

bodyEl.addEventListener("click",e=>{

  if(btn.dataset.editrecipe){ editRecipe(btn.dataset.editrecipe); return; }
  if(btn.dataset.delrecipe){
    const id=btn.dataset.delrecipe;
    const rr=(S.customRecipes||[]).find(r=>r.id===id);

  if(btn.dataset.drink&&m){

  listIds(active).forEach(i=>delete S.done[i]); save(); render();
});
$("undoBtn").addEventListener("click",doUndo);
searchEl.addEventListener("input",e=>{ query=e.target.value; render(); });

/* ---- offline support ---- */
function markOnline(){ document.body.classList.toggle("is-offline", !navigator.onLine); }
window.addEventListener("online", ()=>{ markOnline();
  if(S.tripCode && window.__fb && window.__fb.configured){ fbPush().catch(()=>{}); }
});
window.addEventListener("offline", markOnline);
markOnline();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound", ()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          if(nw.state==="installed" && navigator.serviceWorker.controller){
            const t=$("updToast"); if(t) t.hidden=false;
            const b=$("updBtn");
            if(b) b.onclick=()=>{ nw.postMessage("skipWaiting"); location.reload(); };
          }
        });
      });
    }).catch(()=>{});
    let reloading=false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(reloading) return; reloading=true; location.reload();
    });
  });
}

(async()=>{
  await load();
  const h=location.hash||"";
  if(h.indexOf("#t=")===0){
    const code=h.slice(3).trim().toUpperCase();
    const have=await waitForFb();
    if(have && fbConfigured() && code){
      const ok=confirm("Join live sync for trip "+code+"? This links this device to that shared trip and replaces what's here now.");
      if(ok){ S.tripCode=code; fbStatus="Connecting…"; subscribeFb(code); }
    } else {
      fbStatus="That invite link needs live sync set up first.";
    }
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  } else if(S.tripCode){
    const have=await waitForFb();
    if(have && fbConfigured()){ fbStatus="Connecting…"; subscribeFb(S.tripCode); }
  }
  searchEl.style.display=isForm(active)?"none":"";
  render();
  // The Firebase block is a module importing from a CDN, so window.__fb lands well
  // after this first paint. Without a second render the share panel stays stuck on
  // "not set up yet" and never offers the button that starts live sync.
  if(!S.tripCode) waitForFb().then(ok=>{ if(ok) render(); });
})();
</script>
</body>
</html>
